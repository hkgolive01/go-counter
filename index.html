<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AI 圍棋拍照數子</title>
  <style>
    :root {
      --bg-main: #f7f8fa;
      --bg-card: #ffffff;
      --bg-subtle: #f1f3f6;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --accent: #0f172a;
      --accent-gold: #b45309;
      --accent-gold-bg: #fef3c7;
      --border-light: rgba(17, 24, 39, 0.08);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 30px -5px rgba(15, 23, 42, 0.07), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
      --shadow-lg: 0 20px 40px -12px rgba(15, 23, 42, 0.12);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 520px;
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 16px);
      position: relative;
    }

    /* Views */
    .view {
      display: none;
      flex-direction: column;
      flex: 1;
      animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .view.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Home View */
    .home-header {
      padding: 20px 4px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
    }
    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    .hero-card {
      margin-top: 12px;
      background: linear-gradient(145deg, #ffffff 0%, #f9fafb 100%);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 32px 24px 28px;
      box-shadow: var(--shadow-md);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero-icon-wrap {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border: 1px solid rgba(217, 119, 6, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px -6px rgba(217, 119, 6, 0.25);
      position: relative;
    }
    .stone-pair {
      position: relative;
      width: 44px;
      height: 44px;
    }
    .stone-b {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #4b5563, #111827 75%);
      box-shadow: 0 4px 8px rgba(0,0,0,0.28);
    }
    .stone-w {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #ffffff, #e5e7eb 80%);
      border: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .hero-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .hero-desc {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
      max-width: 320px;
      margin: 0 auto 22px;
    }

    .size-pills {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .size-pill {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--bg-subtle);
      color: var(--text-secondary);
    }

    .cta-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      appearance: none;
      border: none;
      outline: none;
      width: 100%;
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      background: var(--accent);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 24px -6px rgba(15, 23, 42, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      appearance: none;
      border: 1px solid var(--border-light);
      outline: none;
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn-secondary:active {
      transform: scale(0.98);
      background: var(--bg-subtle);
    }

    .feature-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .feature-item {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .feature-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-gold);
      background: var(--accent-gold-bg);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }
    .feature-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 3px;
    }
    .feature-sub {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* Result View */
    .result-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px 10px;
      gap: 8px;
      flex-shrink: 0;
    }
    .meta-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge-pill {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }
    .badge-pill.size {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }
    .badge-pill.phase {
      background: #ecfdf5;
      color: #047857;
      border-color: rgba(4, 120, 87, 0.15);
    }
    .badge-pill.phase.yose {
      background: #fffbeb;
      color: #b45309;
      border-color: rgba(180, 83, 9, 0.2);
    }

    .btn-toggle-view {
      appearance: none;
      border: 1px solid var(--border-light);
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn-toggle-view.active-orig {
      background: #ea580c;
      color: #ffffff;
      border-color: #ea580c;
    }

    /* Scoreboard */
    .score-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .score-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .score-card.black-card {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      border-color: #0f172a;
    }
    .score-card.white-card {
      background: #ffffff;
      color: var(--text-primary);
    }

    .score-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .player-side {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
    }
    .stone-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }
    .stone-dot.b {
      background: radial-gradient(circle at 35% 35%, #64748b, #000000);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .stone-dot.w {
      background: radial-gradient(circle at 35% 35%, #ffffff, #cbd5e1);
      border: 1px solid rgba(0,0,0,0.2);
    }

    .score-main {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin: 2px 0 4px;
    }
    .score-num {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }
    .score-unit {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.8;
    }
    .score-detail {
      font-size: 11px;
      opacity: 0.72;
      font-variant-numeric: tabular-nums;
    }

    /* Board Canvas Container */
    .board-stage-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      margin: 2px 0 8px;
    }
    .canvas-container {
      background: var(--bg-card);
      padding: 6px;
      border-radius: 18px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    canvas#countCanvas {
      display: block;
      border-radius: 12px;
      touch-action: manipulation;
      cursor: pointer;
    }

    .info-strip {
      width: 100%;
      text-align: center;
      margin-top: 8px;
      padding: 7px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      box-shadow: var(--shadow-sm);
    }

    /* Bottom Action Bar */
    .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 10px;
      padding-top: 6px;
      flex-shrink: 0;
    }
    .btn-action {
      appearance: none;
      outline: none;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .btn-action:active {
      transform: scale(0.98);
    }
    .btn-home {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .btn-retake {
      background: var(--accent);
      color: #ffffff;
      border: none;
      box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.3);
    }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
    }
    .loading-overlay.active {
      display: flex;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid #e5e7eb;
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .loading-sub {
      font-size: 13px;
      color: var(--text-secondary);
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Hidden File Inputs -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" />
  <input type="file" id="galleryInput" accept="image/*" />

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-title" id="loadingTitle">正在識別棋盤與格線…</div>
    <div class="loading-sub" id="loadingSub">自動適應 19路 / 13路 / 9路 並計算終局數子</div>
  </div>

  <main class="app-shell">
    <!-- ==================== HOME VIEW ==================== -->
    <section id="homeView" class="view active">
      <header class="home-header">
        <div class="brand-badge">
          <span class="brand-dot"></span>
          <span>AI 圍棋視覺數子引擎</span>
        </div>
      </header>

      <div class="hero-card">
        <div class="hero-icon-wrap">
          <div class="stone-pair">
            <span class="stone-b"></span>
            <span class="stone-w"></span>
          </div>
        </div>
        <h1 class="hero-title">拍照自動數子</h1>
        <p class="hero-desc">
          拍攝或選取圍棋終局照片，自動偵測棋盤格線、判定死活並計算黑白雙方最終子數。
        </p>

        <div class="size-pills">
          <span class="size-pill">19 路標準盤</span>
          <span class="size-pill">13 路中盤</span>
          <span class="size-pill">9 路小盤</span>
        </div>

        <div class="cta-group">
          <button type="button" class="btn-primary" id="btnHomeCamera">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
              <circle cx="12" cy="13" r="3"/>
            </svg>
            拍照數子
          </button>
          <button type="button" class="btn-secondary" id="btnHomeGallery">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            從相簿選取照片
          </button>
        </div>
      </div>

      <div class="feature-grid">
        <div class="feature-item">
          <div class="feature-num">1</div>
          <div class="feature-title">完整拍入</div>
          <div class="feature-sub">將棋盤四邊完整納入畫面</div>
        </div>
        <div class="feature-item">
          <div class="feature-num">2</div>
          <div class="feature-title">自動識別</div>
          <div class="feature-sub">自動適應 19/13/9 路與死活</div>
        </div>
        <div class="feature-item">
          <div class="feature-num">3</div>
          <div class="feature-title">點擊微調</div>
          <div class="feature-sub">輕觸棋塊即可切換死子狀態</div>
        </div>
      </div>
    </section>

    <!-- ==================== RESULT VIEW ==================== -->
    <section id="resultView" class="view">
      <div class="result-topbar">
        <div class="meta-badges">
          <span class="badge-pill size" id="badgeSize">19路</span>
          <span class="badge-pill phase" id="badgePhase">終局數子</span>
          <span class="badge-pill" id="badgeFit">擬合 --%</span>
        </div>
        <button type="button" class="btn-toggle-view" id="btnToggleView">展示原圖</button>
      </div>

      <!-- Black & White Final Counts -->
      <div class="score-grid">
        <div class="score-card black-card">
          <div class="score-header">
            <span class="player-side"><span class="stone-dot b"></span>黑方總數</span>
          </div>
          <div class="score-main">
            <span class="score-num" id="blackTotalNum">--</span>
            <span class="score-unit">子</span>
          </div>
          <div class="score-detail" id="blackDetail">棋子 -- · 領地 --</div>
        </div>

        <div class="score-card white-card">
          <div class="score-header">
            <span class="player-side"><span class="stone-dot w"></span>白方總數</span>
          </div>
          <div class="score-main">
            <span class="score-num" id="whiteTotalNum">--</span>
            <span class="score-unit">子</span>
          </div>
          <div class="score-detail" id="whiteDetail">棋子 -- · 領地 --</div>
        </div>
      </div>

      <!-- Interactive Canvas -->
      <div class="board-stage-wrap" id="boardStageWrap">
        <div class="canvas-container" id="canvasStage">
          <canvas id="countCanvas" width="340" height="340"></canvas>
        </div>
        <div class="info-strip" id="cornerHint">
          點擊盤面上的棋塊可手動標記／取消「死子」
        </div>
      </div>

      <!-- Bottom Navigation Buttons -->
      <div class="bottom-actions">
        <button type="button" class="btn-action btn-home" id="btnBackHome">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          返回主頁
        </button>
        <button type="button" class="btn-action btn-retake" id="btnRetake">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
          重新拍照
        </button>
      </div>
    </section>
  </main>

  <script>
    /* =========================================================================
     * 1. 狀態管理與頁面導航
     * ========================================================================= */
    const VISION_MAX_SIDE = 1100;
    const WARP_S = 760;
    let LN = 19;
    let N = 19;

    const DIRS_4 = [
      [-1, 0],
      [1, 0],
      [0, -1],
      [0, 1],
    ];
    const DIRS_DIAG = [
      [-1, -1],
      [-1, 1],
      [1, -1],
      [1, 1],
    ];
    const DIRS_8 = [...DIRS_4, ...DIRS_DIAG];

    const countUI = {
      file: null,
      img: null,
      board: null,
      boardSize: 19,
      boardCorners: null,
      gridModel: null,
      result: null,
      manualDead: null,
      showOriginal: false,
      viewScale: 1,
      debugPoints: [],
      renderStage: 3,
      stageTimer1: null,
      stageTimer2: null,
      gridPoints: [],
      gridQuality: 0,
      gridKind: "",
      probs: null,
      probMode: null,
    };

    const homeView = document.getElementById("homeView");
    const resultView = document.getElementById("resultView");
    const cameraInput = document.getElementById("cameraInput");
    const galleryInput = document.getElementById("galleryInput");
    const loadingOverlay = document.getElementById("loadingOverlay");

    function switchView(target) {
      if (target === "result") {
        homeView.classList.remove("active");
        resultView.classList.add("active");
      } else {
        resultView.classList.remove("active");
        homeView.classList.add("active");
      }
    }

    document.getElementById("btnHomeCamera").onclick = () => {
      cameraInput.value = "";
      cameraInput.click();
    };
    document.getElementById("btnHomeGallery").onclick = () => {
      galleryInput.value = "";
      galleryInput.click();
    };
    document.getElementById("btnRetake").onclick = () => {
      cameraInput.value = "";
      cameraInput.click();
    };
    document.getElementById("btnBackHome").onclick = () => {
      if (countUI.stageTimer1) clearTimeout(countUI.stageTimer1);
      if (countUI.stageTimer2) clearTimeout(countUI.stageTimer2);
      switchView("home");
    };

    cameraInput.onchange = () => handlePhotoInput(cameraInput);
    galleryInput.onchange = () => handlePhotoInput(galleryInput);

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    async function handlePhotoInput(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      countUI.file = file;
      loadingOverlay.classList.add("active");

      try {
        const img = await loadImage(file);
        countUI.img = img;
        countUI.board = null;
        countUI.boardSize = 19;
        countUI.result = null;
        countUI.manualDead = null;
        countUI.boardCorners = null;
        countUI.debugPoints = [];
        countUI.showOriginal = false;

        switchView("result");
        syncCountToolbar();

        requestAnimationFrame(() => {
          setTimeout(() => {
            runAnalysis();
            loadingOverlay.classList.remove("active");
          }, 50);
        });
      } catch (err) {
        loadingOverlay.classList.remove("active");
        alert("無法讀取圖片：" + (err && err.message ? err.message : String(err)));
      }
    }

     * 2. 介面渲染與分數展示

    function syncCountToolbar() {
      const btn = document.getElementById("btnToggleView");
      if (!btn) return;
      if (countUI.showOriginal) {
        btn.textContent = "展示數子";
        btn.classList.add("active-orig");
      } else {
        btn.textContent = "展示原圖";
        btn.classList.remove("active-orig");
      }
    }

    document.getElementById("btnToggleView").onclick = () => {
      if (!countUI.img) return;
      countUI.showOriginal = !countUI.showOriginal;
      syncCountToolbar();
      updateHintText();
      if (countUI.showOriginal) triggerStagedOriginalReveal();
      else drawCountCanvas();
    };

    function triggerStagedOriginalReveal() {
      if (countUI.stageTimer1) clearTimeout(countUI.stageTimer1);
      if (countUI.stageTimer2) clearTimeout(countUI.stageTimer2);
      countUI.renderStage = 1;
      drawCountCanvas();
      countUI.stageTimer1 = setTimeout(() => {
        countUI.renderStage = 2;
        drawCountCanvas();
      }, 160);
      countUI.stageTimer2 = setTimeout(() => {
        countUI.renderStage = 3;

    function updateHintText() {
      const hint = document.getElementById("cornerHint");
      if (!hint) return;
      if (!countUI.board || !countUI.result) return;
      if (countUI.showOriginal) {
        const totalPts = countUI.boardSize * countUI.boardSize;
        hint.textContent = `[${countUI.boardSize}路] 已驗證黑線 ${countUI.debugPoints.length} 段 → 推理紅4角 → 補回 ${totalPts} 綠點`;
      } else {
        hint.textContent = "點擊盤面任意棋塊可手動切換「死子／活子」狀態";
      }
    }

    function updateScoreText() {
      const r = countUI.result;
      const bSize = countUI.board ? countUI.board.length : 19;
      const badgeSize = document.getElementById("badgeSize");
      const badgePhase = document.getElementById("badgePhase");
      const badgeFit = document.getElementById("badgeFit");
      const blackTotalNum = document.getElementById("blackTotalNum");
      const whiteTotalNum = document.getElementById("whiteTotalNum");
      const blackDetail = document.getElementById("blackDetail");
      const whiteDetail = document.getElementById("whiteDetail");

      if (!r) {
        badgeSize.textContent = "--路";

      badgeFit.textContent = `擬合 ${Math.round((countUI.gridQuality || 0) * 100)}%${kindLabel ? " · " + kindLabel : ""}`;

      const fmt = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(1));
      blackTotalNum.textContent = fmt(r.blackTotal);
      whiteTotalNum.textContent = fmt(r.whiteTotal);

    function drawCountCanvas() {
      const canvas = document.getElementById("countCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      const availW = Math.max(240, Math.min(window.innerWidth - 48, 480));
      const availH = Math.max(240, window.innerHeight - 310);
      const boxSize = Math.floor(Math.min(availW, availH));

      const img = countUI.img;
      const showImage =
        img && (countUI.showOriginal || !(countUI.board && countUI.result));

      if (showImage) {
        const scale = Math.min(boxSize / img.width, boxSize / img.height, 1);
        countUI.viewScale = scale;
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.style.width = canvas.width + "px";
        canvas.style.height = canvas.height + "px";
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        if (countUI.showOriginal) {
          const rStage = countUI.renderStage || 3;

          const segs = countUI.debugPoints;
          if (rStage >= 1 && segs && segs.length) {
            ctx.save();
            ctx.lineCap = "round";
            ctx.strokeStyle = "rgba(0, 35, 60, 0.75)";
            ctx.lineWidth = Math.max(2.5, Math.round(canvas.width * 0.0045));
            for (const s of segs) {
              if (s.x1 === undefined) continue;
              ctx.beginPath();
              ctx.moveTo(s.x1 * scale, s.y1 * scale);
              ctx.lineTo(s.x2 * scale, s.y2 * scale);
              ctx.stroke();
            }
            ctx.strokeStyle = "rgba(0, 229, 255, 0.95)";
            ctx.lineWidth = Math.max(1.5, Math.round(canvas.width * 0.0028));
            for (const s of segs) {
              if (s.x1 === undefined) continue;
              ctx.beginPath();
              ctx.moveTo(s.x1 * scale, s.y1 * scale);
              ctx.lineTo(s.x2 * scale, s.y2 * scale);
              ctx.stroke();
            }
            ctx.restore();
          }

          const corners = countUI.boardCorners;
          if (rStage >= 2 && corners && corners.length === 4) {
            ctx.save();
            ctx.strokeStyle = "#ff1744";
            ctx.lineWidth = Math.max(2.5, Math.round(canvas.width * 0.006));
            ctx.lineJoin = "round";
            ctx.beginPath();
            ctx.moveTo(corners[0].x * scale, corners[0].y * scale);
            for (let i = 1; i < 4; i++)
              ctx.lineTo(corners[i].x * scale, corners[i].y * scale);
            ctx.closePath();
            ctx.stroke();
            ctx.fillStyle = "#ff1744";
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.font =
              "bold " +
              Math.max(14, Math.round(canvas.width * 0.035)) +
              "px sans-serif";
            for (let i = 0; i < 4; i++) {
              const cx = corners[i].x * scale,
                cy = corners[i].y * scale;
              ctx.beginPath();
              ctx.arc(cx, cy, Math.max(4, canvas.width * 0.008), 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
              ctx.fillText(String(i + 1), cx + 7, cy - 7);
            }
            ctx.restore();
          }

          const gPts =
            countUI.gridPoints && countUI.gridPoints.length
              ? countUI.gridPoints
              : countUI.gridModel && countUI.gridModel.points
                ? countUI.gridModel.points.flat()
                : [];
          if (rStage >= 3 && gPts.length) {
            ctx.save();
            const dotR = Math.max(2.2, canvas.width * 0.0042);
            ctx.fillStyle = "#00e600";
            ctx.strokeStyle = "rgba(0, 40, 0, 0.85)";
            ctx.lineWidth = 1;
            for (const p of gPts) {
              ctx.beginPath();
              ctx.arc(p.x * scale, p.y * scale, dotR, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
            }
            ctx.restore();
          }
        }
        return;
      }

      if (countUI.board && countUI.result) {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(boxSize * dpr);
        canvas.height = Math.round(boxSize * dpr);
        canvas.style.width = boxSize + "px";
        canvas.style.height = boxSize + "px";
        ctx.save();
        ctx.scale(dpr, dpr);
        renderCleanAlignedBoard(ctx, boxSize);
        ctx.restore();
      }
    }

    function getStarPointCoords(bSize) {
      if (bSize === 19) {
        const pts = [];
        for (const r of [3, 9, 15]) for (const c of [3, 9, 15]) pts.push([r, c]);
        return pts;
      }
      if (bSize === 13) {
        return [
          [3, 3],
          [3, 9],
          [6, 6],
          [9, 3],
          [9, 9],
        ];
      }
      if (bSize === 9) {
        return [
          [2, 2],
          [2, 6],
          [4, 4],
          [6, 2],
          [6, 6],
        ];
      }
      return [];
    }

    function renderCleanAlignedBoard(ctx, size) {
      const board = countUI.board;
      const bSize = board ? board.length : 19;
      const res = countUI.result;
      const dead = res ? res.deadStones : new Set();
      const tmap = res ? res.territoryMap : null;
      const pad = size * 0.048;
      const cell = (size - pad * 2) / (bSize - 1);

      // 木紋質感暖色棋盤底色
      ctx.fillStyle = "#e8c37a";
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = "#332818";
      ctx.lineWidth = 1;
      for (let i = 0; i < bSize; i++) {
        const p = pad + i * cell;
        ctx.beginPath();
        ctx.moveTo(pad, p);
        ctx.lineTo(size - pad, p);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p, pad);
        ctx.lineTo(p, size - pad);
        ctx.stroke();
      }

      for (const [sr, sc] of getStarPointCoords(bSize)) {
        ctx.fillStyle = "#221a0f";
        ctx.beginPath();
        ctx.arc(pad + sc * cell, pad + sr * cell, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }

      const r = cell * 0.445;
      for (let y = 0; y < bSize; y++) {
        for (let x = 0; x < bSize; x++) {
          const cx = pad + x * cell;
          const cy = pad + y * cell;
          const key = `${y},${x}`;
          const isDead = dead.has(key);
          const v = board[y][x];
          const terr = tmap ? tmap[y][x] : 0;

          if (v === 1 || v === 2) {
            ctx.fillStyle = v === 1 ? "#151515" : "#f7f7f7";
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            if (v === 2) {
              ctx.strokeStyle = "#888";
              ctx.lineWidth = 1;
              ctx.stroke();
            }
            if (isDead) {
              const s = cell * 0.28;
              ctx.fillStyle = v === 1 ? "#f7f7f7" : "#151515";
              ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
              ctx.strokeStyle = "#e53935";
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(cx - r * 0.55, cy - r * 0.55);
              ctx.lineTo(cx + r * 0.55, cy + r * 0.55);
              ctx.moveTo(cx + r * 0.55, cy - r * 0.55);
              ctx.lineTo(cx - r * 0.55, cy + r * 0.55);
              ctx.stroke();
              ctx.lineWidth = 1;
            }
          } else if (terr === 1 || terr === 4) {
            const s = cell * (terr === 1 ? 0.28 : 0.2);
            ctx.fillStyle = terr === 1 ? "#111" : "rgba(20, 20, 20, 0.65)";
            ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
          } else if (terr === 2 || terr === 5) {
            const s = cell * (terr === 2 ? 0.28 : 0.2);
            ctx.fillStyle = terr === 2 ? "#f7f7f7" : "rgba(255, 255, 255, 0.8)";
            ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
            ctx.strokeStyle = "#777";
            ctx.strokeRect(cx - s / 2, cy - s / 2, s, s);
          }
        }
      }
    }

    function runAnalysis() {
      if (!countUI.img) return;
      const hint = document.getElementById("cornerHint");
      try {
        const result = runGoVisionStep1(countUI.img);
        if (!result || !result.board) throw new Error("無法識別棋盤");
        countUI.board = result.board;
        countUI.boardSize = result.size || result.board.length;
        countUI.boardCorners = result.boardCorners;
        countUI.gridModel = result.gridModel;
        countUI.gridPoints = result.gridPoints || [];
        countUI.probs = result.probs || null;
        countUI.debugPoints = result.debugPoints || [];
        countUI.gridQuality = result.gridQuality || 0;
        countUI.gridKind = result.gridKind || "";
        countUI.probMode = null;
        countUI.showOriginal = false;
        countUI.renderStage = 3;

        const initialScore = analyzeAndScoreChineseGo(result.board, new Set());
        countUI.manualDead = new Set(initialScore.deadStones);
        countUI.result = initialScore;

        updateScoreText();
        updateHintText();
        syncCountToolbar();
        drawCountCanvas();
      } catch (e) {
        console.error("Step1 error", e);
        countUI.board = null;
        countUI.result = null;
        countUI.showOriginal = true;
        countUI.renderStage = 1;
        if (hint) {
          hint.textContent = "識別失敗：" + (e && e.message ? e.message : String(e));
        }
        updateScoreText();
        syncCountToolbar();
        drawCountCanvas();
      }
    }

    /* =========================================================================
     * 3. 電腦視覺格線擬合與交點分類 (19 / 13 / 9 路自動適應)
     * ========================================================================= */
    function runGoVisionStep1(imgSource) {
      const { canvas, scale, width, height } = resizeImage(
        imgSource,
        VISION_MAX_SIDE,
      );
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const imgData = ctx.getImageData(0, 0, width, height);
      const P = buildPlanes(imgData.data, width, height);
      const bc = estimateBoardColor(P);

      const rawScan = scanWholeImageBlackLines(P, bc, scale);
      const wholeImgSegs = rawScan.filteredSegs;
      if (typeof countUI !== "undefined") {
        countUI.debugPoints = wholeImgSegs;
      }
      const qColor = detectBoardQuadByColor(P, bc);
      const m = 2;
      const fullQuad = [
        { x: m, y: m },
        { x: width - 1 - m, y: m },
        { x: width - 1 - m, y: height - 1 - m },
        { x: m, y: height - 1 - m },
      ];

      let best = null;
      let detectedSize = 19;
      for (const trySize of [19, 13, 9]) {
        LN = trySize;
        const cands = [];
        const qLines = detectBoardQuadFromSegments(
          rawScan.hSegsPx,
          rawScan.vSegsPx,
          width,
          height,
        );
        if (qLines) {
          cands.push({
            quad: qLines,
            expand: 1.06,
            spanMin: 0.72,
            spanMax: 0.99,
            kind: "lines",
          });
        }
        if (qColor) {
          cands.push({
            quad: qColor,
            expand: 1.04,
            spanMin: 0.58,
            spanMax: 1.0,
            kind: "color",
          });
        }
        cands.push({
          quad: fullQuad,
          expand: 1.0,
          spanMin: 0.35,
          spanMax: 1.0,
          kind: "full",
        });
        let sizeBest = null;
        for (const c of cands) {
          let fit = null;
          try {
            fit = fitLatticeFromQuad(P, bc, c, rawScan);
          } catch (err) {
            console.warn(`lattice fit (${trySize}x${trySize}) failed`, c.kind, err);
          }
          if (fit && (!sizeBest || fit.totalScore > sizeBest.totalScore)) {
            sizeBest = fit;
          }
        }
        if (sizeBest && sizeBest.quality >= 0.18) {
          best = sizeBest;
          detectedSize = trySize;
          break;
        }
      }
      if (!best || best.quality < 0.18) {
        throw new Error("找不到完整的 19 路、13 路或 9 路格線");
      }
      LN = detectedSize;
      N = detectedSize;

      const snappedPts = snapGridToDetectedSegments(
        best.pts,
        rawScan.hSegsPx,
        rawScan.vSegsPx,
        P,
        bc,
      );
      const pts = snappedPts || best.pts;
      const cls = classifyIntersections(P, pts, bc);

      const gridVerifiedSegs = extractVerifiedGridSubSegments(
        P,
        bc,
        pts,
        cls.board,
        scale,
      );
      const combinedSegs = mergeLineSegments(
        gridVerifiedSegs,
        wholeImgSegs,
        pts,
        cls.board,
        scale,
      );
      const flatGridPoints = [];
      for (let r = 0; r < LN; r++) {
        for (let c = 0; c < LN; c++) {
          flatGridPoints.push({
            x: pts[r][c].x / scale,
            y: pts[r][c].y / scale,
            r,
            c,
          });
        }
      }
      const last = LN - 1;
      return {
        board: cls.board,
        boardCorners: [pts[0][0], pts[0][last], pts[last][last], pts[last][0]].map(
          (p) => ({
            x: p.x / scale,
            y: p.y / scale,
          }),
        ),
        gridModel: {
          points: pts.map((row) =>
            row.map((p) => ({ x: p.x / scale, y: p.y / scale })),
          ),
        },
        gridPoints: flatGridPoints,
        confidenceMap: cls.confidence,
        debugPoints: combinedSegs,
        probs: null,
        size: LN,
        gridQuality: best.quality,
        gridKind: best.kind,
      };
    }

    function median(arr) {
      if (!arr.length) return 0;
      const a = Array.from(arr).sort((x, y) => x - y);
      return a[Math.floor(a.length / 2)];
    }
    function clamp(v, lo, hi) {
      return v < lo ? lo : v > hi ? hi : v;
    }
    function hueDist(a, b) {
      const d = Math.abs(a - b) % 360;
      return d > 180 ? 360 - d : d;
    }

    function buildPlanes(data, w, h) {
      const n = w * h;
      const lum = new Float32Array(n),
        sat = new Float32Array(n),
        hue = new Float32Array(n);
      for (let i = 0, p = 0; i < n; i++, p += 4) {
        const r = data[p],
          g = data[p + 1],
          b = data[p + 2];
        lum[i] = 0.299 * r + 0.587 * g + 0.114 * b;
        const mx = Math.max(r, g, b),
          mn = Math.min(r, g, b);
        const d = mx - mn;
        sat[i] = mx > 0 ? d / mx : 0;
        let hh = 0;
        if (d > 0) {
          if (mx === r) hh = ((g - b) / d) % 6;
          else if (mx === g) hh = (b - r) / d + 2;
          else hh = (r - g) / d + 4;
          hh *= 60;
          if (hh < 0) hh += 360;
        }
        hue[i] = hh;
      }
      return { lum, sat, hue, w, h };
    }

    function estimateBoardColor(P) {
      const { w, h, lum, sat, hue } = P;
      const hist = new Float32Array(36);
      let total = 0,
        colored = 0;
      const x0 = Math.floor(w * 0.2),
        x1 = Math.floor(w * 0.8);
      const y0 = Math.floor(h * 0.2),
        y1 = Math.floor(h * 0.8);
      for (let y = y0; y < y1; y += 3)
        for (let x = x0; x < x1; x += 3) {
          const i = y * w + x;
          const l = lum[i];
          if (l < 55 || l > 235) continue;
          total++;
          if (sat[i] > 0.22) {
            hist[Math.floor(hue[i] / 10) % 36]++;
            colored++;
          }
        }
      if (total < 50) return { useHue: false, hue: 0, L: 150, S: 0.1 };
      const useHue = colored > total * 0.25;
      let hueC = 0;
      if (useHue) {
        let bi = 0,
          bv = -1;
        for (let b = 0; b < 36; b++) {
          const v = hist[(b + 35) % 36] + 2 * hist[b] + hist[(b + 1) % 36];
          if (v > bv) {
            bv = v;
            bi = b;
          }
        }
        hueC = bi * 10 + 5;
      }
      const Ls = [],
        Ss = [];
      for (let y = y0; y < y1; y += 3)
        for (let x = x0; x < x1; x += 3) {
          const i = y * w + x;
          const l = lum[i];
          if (l < 55 || l > 235) continue;
          if (useHue) {
            if (sat[i] > 0.22 && hueDist(hue[i], hueC) < 20) {
              Ls.push(l);
              Ss.push(sat[i]);
            }
          } else if (sat[i] <= 0.22) {
            Ls.push(l);
            Ss.push(sat[i]);
          }
        }
      return {
        useHue,
        hue: hueC,
        L: Ls.length ? median(Ls) : 150,
        S: Ss.length ? median(Ss) : 0.1,
      };
    }

    function isBoardPixel(P, i, bc) {
      const l = P.lum[i],
        s = P.sat[i];
      if (bc.useHue)
        return (
          hueDist(P.hue[i], bc.hue) < 24 &&
          s > bc.S * 0.45 &&
          l > bc.L * 0.55 &&
          l < Math.min(255, bc.L * 1.5)
        );
      return s < bc.S + 0.1 && Math.abs(l - bc.L) < bc.L * 0.2;
    }

    function scanWholeImageBlackLines(P, bc, scale) {
      const { w, h, lum, sat } = P;
      const d = Math.max(2, Math.round(Math.max(w, h) / 260));
      const Lmin = bc.L * 0.52,
        Lmax = Math.min(242, bc.L * 1.38);
      const satMin = bc.useHue ? bc.S * 0.4 : -1;

      const isBoardIdx = (idx) =>
        lum[idx] >= Lmin &&
        lum[idx] <= Lmax &&
        sat[idx] >= satMin &&
        (!bc.useHue || hueDist(P.hue[idx], bc.hue) < 26);

      const rh = new Float32Array(w * h);
      const rv = new Float32Array(w * h);

      for (let y = d + 1; y < h - d - 1; y++) {
        for (let x = d + 1; x < w - d - 1; x++) {
          const i = y * w + x;
          const l = lum[i];
          if (l >= bc.L * 0.9) continue;

          const u = i - d * w,
            dn = i + d * w;
          if (isBoardIdx(u) && isBoardIdx(dn) && Math.abs(lum[u] - lum[dn]) < 36) {
            const m = Math.min(lum[u], lum[dn]);
            const dip = m - l;
            if (dip > 10 && l < m * 0.86) rh[i] = Math.min(80, dip);
          }

          const lf = i - d,
            rt = i + d;
          if (
            isBoardIdx(lf) &&
            isBoardIdx(rt) &&
            Math.abs(lum[lf] - lum[rt]) < 36
          ) {
            const m = Math.min(lum[lf], lum[rt]);
            const dip = m - l;
            if (dip > 10 && l < m * 0.86) rv[i] = Math.min(80, dip);
          }
        }
      }

      const minLen = Math.max(10, Math.round(Math.min(w, h) * 0.022));
      const rawH = extractContinuousRunsFromMap(rh, w, h, true, minLen);
      const rawV = extractContinuousRunsFromMap(rv, w, h, false, minLen);

      const all = rawH
        .map((s) => ({ ...s, dir: "h" }))
        .concat(rawV.map((s) => ({ ...s, dir: "v" })));
      const rad = Math.min(w, h) * 0.14;
      const rad2 = rad * rad;
      const keep = all.filter((s) => {
        const mx = (s.x1 + s.x2) / 2,
          my = (s.y1 + s.y2) / 2;
        let nbOrtho = 0,
          nbPara = 0;
        for (const o of all) {
          if (o === s) continue;
          const omx = (o.x1 + o.x2) / 2,
            omy = (o.y1 + o.y2) / 2;
          const d2 = (mx - omx) * (mx - omx) + (my - omy) * (my - omy);
          if (d2 <= rad2) {
            if (o.dir !== s.dir) nbOrtho++;
            else nbPara++;
          }
        }
        return nbOrtho >= 1 || nbPara >= 2;
      });

      const hSegsPx = keep.filter((s) => s.dir === "h");
      const vSegsPx = keep.filter((s) => s.dir === "v");
      const filteredSegs = keep.map((s) => ({
        x1: s.x1 / scale,
        y1: s.y1 / scale,
        x2: s.x2 / scale,
        y2: s.y2 / scale,
        verified: true,
        source: "raw",
      }));

      return { hSegsPx, vSegsPx, filteredSegs, rh, rv };
    }

    function extractContinuousRunsFromMap(resp, w, h, horizontal, minLen) {
      const visited = new Uint8Array(w * h);
      const segs = [];
      const pMax = horizontal ? h : w;
      const tMax = horizontal ? w : h;
      const idxOf = (t, p) => (horizontal ? p * w + t : t * w + p);

      for (let p0 = 2; p0 < pMax - 2; p0++) {
        for (let t0 = 2; t0 < tMax - 2; t0++) {
          const idx = idxOf(t0, p0);
          if (visited[idx] || resp[idx] < 11) continue;
          if (
            resp[idx] < resp[idxOf(t0, p0 - 1)] ||
            resp[idx] < resp[idxOf(t0, p0 + 1)]
          )
            continue;

          const pts = [];
          let curP = p0;
          let gap = 0;

          for (let t = t0; t < tMax - 2; t++) {
            let bestV = 0,
              bestP = curP;
            for (let dp = -1; dp <= 1; dp++) {
              const np = curP + dp;
              if (np < 1 || np >= pMax - 1) continue;
              const v = resp[idxOf(t, np)];
              if (v > bestV) {
                bestV = v;
                bestP = np;
              }
            }
            if (bestV >= 9.5) {
              curP = bestP;
              gap = 0;
              visited[idxOf(t, curP)] = 1;
              if (curP > 0) visited[idxOf(t, curP - 1)] = 1;
              if (curP + 1 < pMax) visited[idxOf(t, curP + 1)] = 1;
              pts.push({ t, p: curP, w: bestV });
            } else {
              gap++;
              if (gap > 1) break;
            }
          }

          if (pts.length >= minLen) {
            let sw = 0,
              st = 0,
              sp = 0,
              stt = 0,
              stp = 0;
            for (const q of pts) {
              sw += q.w;
              st += q.w * q.t;
              sp += q.w * q.p;
              stt += q.w * q.t * q.t;
              stp += q.w * q.t * q.p;
            }
            const den = sw * stt - st * st;
            if (Math.abs(den) < 1e-6) continue;
            const b = (sw * stp - st * sp) / den;
            const a = (sp - b * st) / sw;
            if (Math.abs(b) > 0.35) continue;

            let errSum = 0;
            for (const q of pts) {
              const e = q.p - (a + b * q.t);
              errSum += e * e;
            }
            const rms = Math.sqrt(errSum / pts.length);
            if (rms <= 1.15) {
              const tStart = pts[0].t,
                tEnd = pts[pts.length - 1].t;
              const pStart = a + b * tStart,
                pEnd = a + b * tEnd;
              segs.push(
                horizontal
                  ? { x1: tStart, y1: pStart, x2: tEnd, y2: pEnd, a, b, pts }
                  : { x1: pStart, y1: tStart, x2: pEnd, y2: tEnd, a, b, pts },
              );
            }
          }
        }
      }
      return segs;
    }

    function detectBoardQuadFromSegments(hSegs, vSegs, w, h) {
      const minSegs = Math.max(5, Math.floor(LN * 0.6));
      if (hSegs.length < minSegs || vSegs.length < minSegs) return null;
      const hSorted = hSegs
        .slice()
        .sort((a, b) => (a.y1 + a.y2) / 2 - (b.y1 + b.y2) / 2);
      const vSorted = vSegs
        .slice()
        .sort((a, b) => (a.x1 + a.x2) / 2 - (b.x1 + b.x2) / 2);
      const kSample = Math.min(8, Math.max(3, Math.floor(LN * 0.4)));
      const topB = median(hSorted.slice(0, kSample).map((s) => s.b));
      const botB = median(
        hSorted.slice(Math.max(0, hSorted.length - kSample)).map((s) => s.b),
      );
      const leftB = median(vSorted.slice(0, kSample).map((s) => s.b));
      const rightB = median(
        vSorted.slice(Math.max(0, vSorted.length - kSample)).map((s) => s.b),
      );
      const allPts = [];
      for (const s of hSegs.concat(vSegs)) {
        allPts.push({ x: s.x1, y: s.y1 }, { x: s.x2, y: s.y2 });
      }
      if (allPts.length < minSegs * 2) return null;
      const topVals = allPts.map((p) => p.y - topB * p.x).sort((a, b) => a - b);
      const botVals = allPts.map((p) => p.y - botB * p.x).sort((a, b) => a - b);
      const leftVals = allPts.map((p) => p.x - leftB * p.y).sort((a, b) => a - b);
      const rightVals = allPts.map((p) => p.x - rightB * p.y).sort((a, b) => a - b);
      const qIdx = (arr, q) =>
        arr[clamp(Math.floor(arr.length * q), 0, arr.length - 1)];
      const topLine = { a: qIdx(topVals, 0.01), b: topB };
      const botLine = { a: qIdx(botVals, 0.99), b: botB };
      const leftLine = { a: qIdx(leftVals, 0.01), b: leftB };
      const rightLine = { a: qIdx(rightVals, 0.99), b: rightB };
      const tl = intersectLines(topLine, leftLine);
      const tr = intersectLines(topLine, rightLine);
      const br = intersectLines(botLine, rightLine);
      const bl = intersectLines(botLine, leftLine);
      const quad = [tl, tr, br, bl];
      if (quad.some((p) => !isFinite(p.x) || !isFinite(p.y))) return null;
      if (polygonArea(quad) < w * h * 0.12) return null;
      return quad;
    }

    function detectBoardQuadByColor(P, bc) {
      const { w, h } = P;
      const ds = Math.max(2, Math.round(Math.max(w, h) / 220));
      const bw = Math.floor(w / ds),
        bh = Math.floor(h / ds);
      const woodMask = new Uint8Array(bw * bh);
      for (let by = 0; by < bh; by++)
        for (let bx = 0; bx < bw; bx++) {
          let cnt = 0,
            tot = 0;
          for (let yy = by * ds; yy < (by + 1) * ds; yy++)
            for (let xx = bx * ds; xx < (bx + 1) * ds; xx++) {
              tot++;
              if (isBoardPixel(P, yy * w + xx, bc)) cnt++;
            }
          if (cnt > tot * 0.35) woodMask[by * bw + bx] = 1;
        }

      const dil = new Uint8Array(bw * bh);
      const rad = 3;
      for (let y = 0; y < bh; y++)
        for (let x = 0; x < bw; x++) {
          let on = 0;
          for (let dy = -rad; dy <= rad && !on; dy++)
            for (let dx = -rad; dx <= rad; dx++) {
              const ny = y + dy,
                nx = x + dx;
              if (
                ny >= 0 &&
                ny < bh &&
                nx >= 0 &&
                nx < bw &&
                woodMask[ny * bw + nx]
              ) {
                on = 1;
                break;
              }
            }
          dil[y * bw + x] = on;
        }
      const mask = new Uint8Array(bw * bh);
      for (let y = 0; y < bh; y++)
        for (let x = 0; x < bw; x++) {
          let allOn = 1;
          for (let dy = -2; dy <= 2 && allOn; dy++)
            for (let dx = -2; dx <= 2; dx++) {
              const ny = y + dy,
                nx = x + dx;
              if (ny < 0 || ny >= bh || nx < 0 || nx >= bw || !dil[ny * bw + nx]) {
                allOn = 0;
                break;
              }
            }
          mask[y * bw + x] = allOn;
        }

      const lab = new Int32Array(bw * bh).fill(-1);
      const queue = new Int32Array(bw * bh);
      let bestLab = -1,
        bestScore = 0,
        bestSize = 0,
        nl = 0;
      const cbx = bw / 2,
        cby = bh / 2;
      for (let s = 0; s < bw * bh; s++) {
        if (!mask[s] || lab[s] !== -1) continue;
        let qh = 0,
          qt = 0;
        queue[qt++] = s;
        lab[s] = nl;
        let size = 0,
          minx = 1e9,
          maxx = -1,
          miny = 1e9,
          maxy = -1;
        while (qh < qt) {
          const cur = queue[qh++];
          size++;
          const cx = cur % bw,
            cy = (cur / bw) | 0;
          if (cx < minx) minx = cx;
          if (cx > maxx) maxx = cx;
          if (cy < miny) miny = cy;
          if (cy > maxy) maxy = cy;
          const nb = [
            cx > 0 ? cur - 1 : -1,
            cx < bw - 1 ? cur + 1 : -1,
            cy > 0 ? cur - bw : -1,
            cy < bh - 1 ? cur + bw : -1,
          ];
          for (const n of nb) {
            if (n >= 0 && mask[n] && lab[n] === -1) {
              lab[n] = nl;
              queue[qt++] = n;
            }
          }
        }
        const containsCenter =
          minx <= cbx && maxx >= cbx && miny <= cby && maxy >= cby;
        const score = size * (containsCenter ? 1.5 : 1);
        if (score > bestScore) {
          bestScore = score;
          bestLab = nl;
          bestSize = size;
        }
        nl++;
      }
      if (bestLab < 0 || bestSize < bw * bh * 0.08) return null;

      const rowMin = new Int32Array(bh).fill(1e9),
        rowMax = new Int32Array(bh).fill(-1);
      for (let s = 0; s < bw * bh; s++) {
        if (lab[s] !== bestLab) continue;
        const x = s % bw,
          y = (s / bw) | 0;
        if (x < rowMin[y]) rowMin[y] = x;
        if (x > rowMax[y]) rowMax[y] = x;
      }
      const pts = [];
      for (let y = 0; y < bh; y++) {
        if (rowMax[y] < 0) continue;
        const xl = rowMin[y] * ds,
          xr = (rowMax[y] + 1) * ds;
        pts.push({ x: xl, y: y * ds }, { x: xl, y: (y + 1) * ds });
        pts.push({ x: xr, y: y * ds }, { x: xr, y: (y + 1) * ds });
      }
      const hull = convexHull(pts);
      const quad = maxAreaQuad(hull);
      if (!quad || polygonArea(quad) < w * h * 0.1) return null;
      return quad;
    }

    function convexHull(pts) {
      const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
      if (p.length < 3) return p;
      const cross = (o, a, b) =>
        (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
      const lower = [];
      for (const q of p) {
        while (
          lower.length >= 2 &&
          cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0
        )
          lower.pop();
        lower.push(q);
      }
      const upper = [];
      for (let i = p.length - 1; i >= 0; i--) {
        const q = p[i];
        while (
          upper.length >= 2 &&
          cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0
        )
          upper.pop();
        upper.push(q);
      }
      upper.pop();
      lower.pop();
      return lower.concat(upper);
    }

    function maxAreaQuad(hull) {
      const n = hull.length;
      if (n < 4) return null;
      if (n === 4) return hull.slice();
      const step = Math.max(1, Math.ceil(n / 36));
      const ids = [];
      for (let i = 0; i < n; i += step) ids.push(i);
      const area4 = (a, b, c, d) =>
        polygonArea([hull[a], hull[b], hull[c], hull[d]]);
      const m = ids.length;
      let best = null,
        bestA = -1;
      for (let a = 0; a < m; a++)
        for (let b = a + 1; b < m; b++)
          for (let c = b + 1; c < m; c++)
            for (let d = c + 1; d < m; d++) {
              const A = area4(ids[a], ids[b], ids[c], ids[d]);
              if (A > bestA) {
                bestA = A;
                best = [ids[a], ids[b], ids[c], ids[d]];
              }
            }
      if (!best) return null;
      let cur = best.slice();
      let improved = true,
        guard = 0;
      while (improved && guard++ < 60) {
        improved = false;
        for (let k = 0; k < 4; k++)
          for (let dlt = -step; dlt <= step; dlt++) {
            if (!dlt) continue;
            const cand = cur.slice();
            cand[k] = (cand[k] + dlt + n) % n;
            const sorted = [...new Set(cand)].sort((x, y) => x - y);
            if (sorted.length < 4) continue;
            const A = area4(sorted[0], sorted[1], sorted[2], sorted[3]);
            if (A > bestA + 1e-6) {
              bestA = A;
              cur = sorted;
              improved = true;
            }
          }
      }
      return cur.map((i) => hull[i]);
    }

    function orderQuad(q) {
      const cx = q.reduce((s, p) => s + p.x, 0) / q.length;
      const cy = q.reduce((s, p) => s + p.y, 0) / q.length;
      const pts = q
        .slice()
        .sort(
          (a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx),
        );
      let start = 0,
        bestV = Infinity;
      pts.forEach((p, i) => {
        if (p.x + p.y < bestV) {
          bestV = p.x + p.y;
          start = i;
        }
      });
      return [0, 1, 2, 3].map((k) => pts[(start + k) % 4]);
    }

    function expandQuad(q, f) {
      const cx = q.reduce((s, p) => s + p.x, 0) / 4;
      const cy = q.reduce((s, p) => s + p.y, 0) / 4;
      return q.map((p) => ({ x: cx + (p.x - cx) * f, y: cy + (p.y - cy) * f }));
    }

    function fitLatticeFromQuad(P, bc, cand) {
      const S = WARP_S;
      const intervals = LN - 1;
      const quad = expandQuad(orderQuad(cand.quad), cand.expand);
      const Hw = computeHomography(
        [
          { x: 0, y: 0 },
          { x: S - 1, y: 0 },
          { x: S - 1, y: S - 1 },
          { x: 0, y: S - 1 },
        ],
        quad,
      );
      const W = warpPlanes(P, Hw, S);
      const { rh, rv } = lineResponses(W, S, bc);
      const cleanRh = filterMapByContinuousRuns(rh, S, true, 8);
      const cleanRv = filterMapByContinuousRuns(rv, S, false, 8);
      const sMin = (S * cand.spanMin) / intervals,
        sMax = (S * cand.spanMax) / intervals;
      const hf = fitAxis(cleanRh, S, true, sMin, sMax);
      const vf = fitAxis(cleanRv, S, false, sMin, sMax);
      if (!hf || !vf) return null;
      let hLines = combToLines(hf, S),
        vLines = combToLines(vf, S);
      for (let it = 0; it < 2; it++) {
        hLines = refineFamily(cleanRh, S, hLines, vLines, true);
        vLines = refineFamily(cleanRv, S, vLines, hLines, false);
      }
      const minSup = LN === 19 ? 4 : 3;
      let activeH = 0,
        activeV = 0;
      for (let i = 0; i < LN; i++) {
        if (hLines[i].support >= minSup) activeH++;
        if (vLines[i].support >= minSup) activeV++;
      }
      const minActivePerAxis = Math.ceil(LN * 0.55);
      if (activeH < minActivePerAxis || activeV < minActivePerAxis) return null;
      const lat = [],
        src = [],
        supportedMask = [];
      for (let i = 0; i < LN; i++)
        for (let j = 0; j < LN; j++) {
          const pw = intersectLines(hLines[i], vLines[j]);
          lat.push({ x: j, y: i });
          src.push(applyH(Hw, pw.x, pw.y));
          supportedMask.push(
            hLines[i].support >= minSup && vLines[j].support >= minSup,
          );
        }
      const pts = regularizeWithHomography(lat, src, supportedMask);
      if (!pts) return null;
      let support = 0;
      const activeLines = activeH + activeV;
      const fullSupTarget = Math.max(10, Math.round(LN * 1.25));
      for (const ln of hLines.concat(vLines)) {
        support += Math.min(1, ln.support / fullSupTarget);
      }
      support /= 2 * LN;
      const edgeSupport =
        (hLines[0].support >= 3 ? 1 : 0) +
        (hLines[LN - 1].support >= 3 ? 1 : 0) +
        (vLines[0].support >= 3 ? 1 : 0) +
        (vLines[LN - 1].support >= 3 ? 1 : 0);
      const quality = ((hf.quality + vf.quality) / 2) * (0.55 + 0.45 * support);
      const totalScore =
        quality *
        (0.75 + 0.25 * (activeLines / (2 * LN))) *
        (0.8 + 0.05 * edgeSupport) *
        (cand.kind === "lines" ? 1.08 : cand.kind === "color" ? 1.04 : 1.0);
      return { pts, quality, totalScore, kind: cand.kind, support };
    }

    function filterMapByContinuousRuns(resp, S, horizontal, minLen) {
      const runs = extractContinuousRunsFromMap(resp, S, S, horizontal, minLen);
      const out = new Float32Array(S * S);
      for (const r of runs) {
        for (const q of r.pts) {
          const idx = horizontal ? q.p * S + q.t : q.t * S + q.p;
          out[idx] = resp[idx];
          if (q.p > 0) {
            const idx1 = horizontal ? (q.p - 1) * S + q.t : q.t * S + (q.p - 1);
            out[idx1] = resp[idx1];
          }
          if (q.p + 1 < S) {
            const idx2 = horizontal ? (q.p + 1) * S + q.t : q.t * S + (q.p + 1);
            out[idx2] = resp[idx2];
          }
        }
      }
      return out;
    }

    function warpPlanes(P, H, S) {
      const L = new Float32Array(S * S),
        Sa = new Float32Array(S * S);
      const { w, h, lum, sat } = P;
      for (let y = 0; y < S; y++)
        for (let x = 0; x < S; x++) {
          const den = H[6] * x + H[7] * y + H[8];
          const sx = (H[0] * x + H[1] * y + H[2]) / den;
          const sy = (H[3] * x + H[4] * y + H[5]) / den;
          const o = y * S + x;
          const x0 = Math.floor(sx),
            y0 = Math.floor(sy);
          if (x0 < 0 || y0 < 0 || x0 >= w - 1 || y0 >= h - 1) {
            L[o] = -1;
            Sa[o] = 0;
            continue;
          }
          const dx = sx - x0,
            dy = sy - y0;
          const i00 = y0 * w + x0,
            i10 = i00 + 1,
            i01 = i00 + w,
            i11 = i01 + 1;
          const w00 = (1 - dx) * (1 - dy),
            w10 = dx * (1 - dy),
            w01 = (1 - dx) * dy,
            w11 = dx * dy;
          L[o] = lum[i00] * w00 + lum[i10] * w10 + lum[i01] * w01 + lum[i11] * w11;
          Sa[o] = sat[i00] * w00 + sat[i10] * w10 + sat[i01] * w01 + sat[i11] * w11;
        }
      return { L, Sa };
    }

    function lineResponses(W, S, bc) {
      const rh = new Float32Array(S * S),
        rv = new Float32Array(S * S);
      const d = Math.max(2, Math.round(S / 250));
      const Lmin = bc.L * 0.5,
        Lmax = Math.min(242, bc.L * 1.42);
      const satMin = bc.useHue ? bc.S * 0.4 : -1;
      const L = W.L,
        Sa = W.Sa;
      const ok = (i) => L[i] >= Lmin && L[i] <= Lmax && Sa[i] >= satMin;
      for (let y = d; y < S - d; y++)
        for (let x = d; x < S - d; x++) {
          const i = y * S + x;
          const l = L[i];
          if (l < 0 || l > bc.L * 0.92) continue;
          const u = i - d * S,
            dn = i + d * S;
          if (ok(u) && ok(dn) && Math.abs(L[u] - L[dn]) < 38) {
            const m = Math.min(L[u], L[dn]);
            const dip = m - l;
            if (dip > 8.5 && l < m * 0.87) rh[i] = Math.min(80, dip);
          }
          const lf = i - d,
            rt = i + d;
          if (ok(lf) && ok(rt) && Math.abs(L[lf] - L[rt]) < 38) {
            const m = Math.min(L[lf], L[rt]);
            const dip = m - l;
            if (dip > 8.5 && l < m * 0.87) rv[i] = Math.min(80, dip);
          }
        }
      return { rh, rv };
    }

    function fitAxis(resp, S, horizontal, sMin, sMax) {
      const half = S / 2;
      const project = (th, stride) => {
        const prof = new Float32Array(S);
        for (let a = 0; a < S; a += stride) {
          const off = th * (a - half);
          for (let b = 0; b < S; b++) {
            const v = horizontal ? resp[b * S + a] : resp[a * S + b];
            if (v === 0) continue;
            const p = Math.round(b + off);
            if (p >= 0 && p < S) prof[p] += v;
          }
        }
        return prof;
      };
      const sharp = (prof) => {
        const sm = gauss5(prof);
        let s = 0;
        for (let i = 0; i < S; i++) s += sm[i] * sm[i];
        return s;
      };
      let bestTh = 0,
        bestSh = -1;
      for (let th = -0.08; th <= 0.0801; th += 0.01) {
        const sh = sharp(project(th, 4));
        if (sh > bestSh) {
          bestSh = sh;
          bestTh = th;
        }
      }
      const t0 = bestTh;
      bestSh = -1;
      for (let th = t0 - 0.0075; th <= t0 + 0.0076; th += 0.0025) {
        const sh = sharp(project(th, 2));
        if (sh > bestSh) {
          bestSh = sh;
          bestTh = th;
        }
      }
      const comb = combFit(project(bestTh, 1), S, sMin, sMax);
      if (!comb) return null;
      comb.shear = bestTh;
      return comb;
    }

    function gauss5(a) {
      const n = a.length,
        o = new Float32Array(n);
      const k = [1, 4, 6, 4, 1];
      for (let i = 0; i < n; i++) {
        let s = 0,
          w = 0;
        for (let t = -2; t <= 2; t++) {
          const j = i + t;
          if (j < 0 || j >= n) continue;
          s += a[j] * k[t + 2];
          w += k[t + 2];
        }
        o[i] = s / w;
      }
      return o;
    }
    function boxMean(a, r) {
      const n = a.length,
        pre = new Float64Array(n + 1),
        o = new Float32Array(n);
      for (let i = 0; i < n; i++) pre[i + 1] = pre[i] + a[i];
      for (let i = 0; i < n; i++) {
        const lo = Math.max(0, i - r),
          hi = Math.min(n, i + r + 1);
        o[i] = (pre[hi] - pre[lo]) / (hi - lo);
      }
      return o;
    }

    function estimateTrueStepFromPeaks(Q, S, sMin, sMax) {
      const peaks = [];
      let maxQ = 0;
      for (let i = 0; i < S; i++) if (Q[i] > maxQ) maxQ = Q[i];
      if (maxQ <= 0) return null;
      const th = maxQ * 0.12;
      for (let i = 3; i < S - 3; i++) {
        if (
          Q[i] >= th &&
          Q[i] >= Q[i - 1] &&
          Q[i] >= Q[i + 1] &&
          Q[i] >= Q[i - 2] &&
          Q[i] >= Q[i + 2]
        ) {
          if (!peaks.length || i - peaks[peaks.length - 1].p >= sMin * 0.65) {
            peaks.push({ p: i, v: Q[i] });
          } else if (Q[i] > peaks[peaks.length - 1].v) {
            peaks[peaks.length - 1] = { p: i, v: Q[i] };
          }
        }
      }
      const minPeaks = Math.max(4, Math.floor(LN * 0.35));
      if (peaks.length < minPeaks) return null;
      const gaps = [];
      for (let i = 0; i < peaks.length - 1; i++) {
        const g = peaks[i + 1].p - peaks[i].p;
        if (g >= sMin * 0.85 && g <= sMax * 1.15) gaps.push(g);
      }
      const minGaps = Math.max(3, Math.floor(LN * 0.25));
      if (gaps.length < minGaps) return null;
      return median(gaps);
    }

    function combFit(prof, S, sMin, sMax) {
      const intervals = LN - 1;
      const halfK = intervals / 2;
      const sm = gauss5(prof);
      const base = boxMean(sm, Math.max(4, Math.round(sMin * 0.4)));
      const Q = new Float32Array(S);
      let maxQ = 0;
      for (let i = 0; i < S; i++) {
        Q[i] = Math.max(0, sm[i] - base[i]);
        if (Q[i] > maxQ) maxQ = Q[i];
      }
      if (maxQ <= 0) return null;
      const estStep = estimateTrueStepFromPeaks(Q, S, sMin, sMax);
      const effMin = estStep ? Math.max(sMin, estStep * 0.945) : sMin;
      const effMax = estStep ? Math.min(sMax, estStep * 1.055) : sMax;
      const at = (p) => {
        const i = Math.round(p);
        if (i < 1 || i > S - 2) return -1;
        const a = Q[i - 1],
          b = Q[i],
          c = Q[i + 1];
        return a > b ? (a > c ? a : c) : b > c ? b : c;
      };
      const posOf = (o, s, gamma, k) => {
        const u = k - halfK;
        return o + k * s + gamma * ((u * u) / halfK - halfK) * s;
      };
      const minPeak = maxQ * 0.06;
      const minActiveTeeth = Math.ceil(LN * 0.63);
      const minParityTeeth = Math.floor(LN * 0.25);
      const scoreOf = (o, s, gamma) => {
        let sc = 0,
          activeTeeth = 0,
          evenActive = 0,
          oddActive = 0;
        for (let k = 0; k < LN; k++) {
          const p = posOf(o, s, gamma, k);
          const v = at(p);
          if (v > minPeak) {
            sc += v;
            activeTeeth++;
            if (k % 2 === 0) evenActive++;
            else oddActive++;
          } else {
            const edgeWeight =
              k === 0 || k === intervals
                ? 0.38
                : k === 1 || k === intervals - 1
                  ? 0.22
                  : 0.08;
            sc -= maxQ * edgeWeight;
          }
        }

        if (
          activeTeeth < minActiveTeeth ||
          evenActive < minParityTeeth ||
          oddActive < minParityTeeth
        ) {
          return -1e9;
        }
        const headSup = Math.max(
          at(posOf(o, s, gamma, 0)),
          at(posOf(o, s, gamma, 1)) * 0.7,
        );
        const tailSup = Math.max(
          at(posOf(o, s, gamma, intervals)),
          at(posOf(o, s, gamma, intervals - 1)) * 0.7,
        );
        if (headSup < minPeak || tailSup < minPeak) sc -= maxQ * 1.2;
        for (const m of [1, 2, 3]) {
          const e1 = at(posOf(o, s, gamma, -m));
          const e2 = at(posOf(o, s, gamma, intervals + m));
          const w = m === 1 ? 1.45 : m === 2 ? 1.25 : 0.9;
          if (e1 > minPeak * 1.2) sc -= w * e1;
          if (e2 > minPeak * 1.2) sc -= w * e2;
        }
        return sc;
      };
      let best = null;
      const gammas = [-0.035, -0.018, 0, 0.018, 0.035];
      for (let s = effMin; s <= effMax + 1e-6; s += 0.25) {
        for (let o = 1; o + intervals * s <= S - 2; o += 0.5) {
          for (const g of gammas) {
            const sc = scoreOf(o, s, g);
            if (!best || sc > best.score)
              best = { score: sc, off: o, step: s, gamma: g };
          }
        }
      }
      if (!best || best.score <= -1e8) return null;
      const b0 = { ...best };
      for (let s = b0.step - 0.25; s <= b0.step + 0.25; s += 0.05) {
        for (let o = b0.off - 0.5; o <= b0.off + 0.5; o += 0.1) {
          if (o < 1 || o + intervals * s > S - 2) continue;
          for (let g = b0.gamma - 0.01; g <= b0.gamma + 0.0101; g += 0.005) {
            const sc = scoreOf(o, s, g);
            if (sc > best.score) best = { score: sc, off: o, step: s, gamma: g };
          }
        }
      }
      let tot = 0;
      for (let i = 0; i < S; i++) tot += Q[i];
      const mark = new Uint8Array(S);
      for (let k = 0; k < LN; k++) {
        const c = Math.round(posOf(best.off, best.step, best.gamma, k));
        for (let d = -2; d <= 2; d++) if (c + d >= 0 && c + d < S) mark[c + d] = 1;
      }
      let near = 0;
      for (let i = 0; i < S; i++) if (mark[i]) near += Q[i];
      best.quality = tot > 0 ? near / tot : 0;
      return best;
    }

    function combToLines(fit, S) {
      const out = [];
      const gamma = fit.gamma || 0;
      const halfK = (LN - 1) / 2;
      for (let k = 0; k < LN; k++) {
        const u = k - halfK;
        const p =
          fit.off + k * fit.step + gamma * ((u * u) / halfK - halfK) * fit.step;
        out.push({ a: p + (fit.shear * S) / 2, b: -fit.shear, support: 0 });
      }
      return out;
    }

    function intersectLines(hl, vl) {
      const y = (hl.a + hl.b * vl.a) / (1 - hl.b * vl.b);
      return { x: vl.a + vl.b * y, y };
    }

    function refineFamily(resp, S, lines, cross, horizontal) {
      const get = (t, p) =>
        t < 0 || p < 0 || t >= S || p >= S
          ? 0
          : horizontal
            ? resp[p * S + t]
            : resp[t * S + p];
      const sumAt = (t, p) => {
        let s = 0;
        for (let k = -2; k <= 2; k++) s += get(t + k, p);
        return s;
      };
      const mid = S / 2;
      const out = [];
      for (let k = 0; k < LN; k++) {
        const ln = lines[k];
        const here = ln.a + ln.b * mid;
        const nb = k < LN - 1 ? lines[k + 1] : lines[k - 1];
        const step = Math.abs(nb.a + nb.b * mid - here);
        const R = Math.max(3, Math.round(step * 0.28));
        const pts = [];
        for (let j = 0; j < LN - 1; j++) {
          const c0 = cross[j].a + cross[j].b * here;
          const c1 = cross[j + 1].a + cross[j + 1].b * here;
          for (const f of [0.2, 0.35, 0.5, 0.65, 0.8]) {
            const t = Math.round(c0 + (c1 - c0) * f);
            if (t < 2 || t > S - 3) continue;
            const pc = Math.round(ln.a + ln.b * t);
            let bv = 0,
              bp = -1;
            const vals = [];
            for (let p = pc - R; p <= pc + R; p++) {
              const v = sumAt(t, p);
              vals.push([p, v]);
              if (v > bv) {
                bv = v;
                bp = p;
              }
            }
            if (bv < 52) continue;
            let second = 0;
            for (const [p, v] of vals)
              if (Math.abs(p - bp) > 2 && v > second) second = v;
            if (second > bv * 0.8) continue;
            const vm = sumAt(t, bp - 1),
              vp = sumAt(t, bp + 1);
            const den = vm - 2 * bv + vp;
            const sub = den < 0 ? clamp((0.5 * (vm - vp)) / den, -0.5, 0.5) : 0;
            pts.push({ t, p: bp + sub, w: Math.sqrt(bv) });
          }
        }
        out.push(fitLineRobust(pts, ln, S, R));
      }
      return out;
    }

    function fitLineRobust(pts, fb, S, R) {
      const minPts = Math.max(3, Math.floor((LN - 1) * 0.25));
      if (pts.length < minPts) return { a: fb.a, b: fb.b, support: 0, inliers: [] };
      let use = pts,
        a = fb.a,
        b = fb.b;
      for (let it = 0; it < 3; it++) {
        let sw = 0,
          st = 0,
          sp = 0,
          stt = 0,
          stp = 0;
        for (const q of use) {
          sw += q.w;
          st += q.w * q.t;
          sp += q.w * q.p;
          stt += q.w * q.t * q.t;
          stp += q.w * q.t * q.p;
        }
        const den = sw * stt - st * st;
        if (Math.abs(den) < 1e-9) break;
        b = (sw * stp - st * sp) / den;
        a = (sp - b * st) / sw;
        const res = use.map((q) => Math.abs(q.p - (a + b * q.t)));
        const lim = Math.max(1.2, median(res) * 2.8);
        const next = use.filter((q, k) => res[k] <= lim);
        if (next.length === use.length || next.length < minPts) break;
        use = next;
      }
      const mid = S / 2;
      if (
        Math.abs(b - fb.b) > 0.06 ||
        Math.abs(a + b * mid - (fb.a + fb.b * mid)) > R
      )
        return { a: fb.a, b: fb.b, support: 0, inliers: [] };
      return { a, b, support: use.length, inliers: use };
    }

    function snapGridToDetectedSegments(pts, hSegsPx, vSegsPx, P, bc) {
      const lat = [],
        src = [];
      for (let r = 0; r < LN; r++)
        for (let c = 0; c < LN; c++) {
          lat.push({ x: c, y: r });
          src.push(pts[r][c]);
        }
      const H = fitHomographyLS(lat, src);
      const Hinv = fitHomographyLS(src, lat);
      if (!H || !Hinv) return pts;
      const OFF = 6;
      const maxIdx = LN + 4;
      const arrLen = LN + 12;
      const rowSupport = new Float32Array(arrLen);
      const colSupport = new Float32Array(arrLen);
      const rowOrthoSpan = new Float32Array(arrLen);
      const colOrthoSpan = new Float32Array(arrLen);

      for (const s of hSegsPx) {
        const p1 = applyH(Hinv, s.x1, s.y1);
        const p2 = applyH(Hinv, s.x2, s.y2);
        const vm = (p1.y + p2.y) / 2;
        const um = (p1.x + p2.x) / 2;
        const rIdx = Math.round(vm);
        const len = Math.hypot(s.x2 - s.x1, s.y2 - s.y1);
        if (
          rIdx >= -5 &&
          rIdx <= maxIdx &&
          Math.abs(vm - rIdx) < 0.28 &&
          um >= -1.5 &&
          um <= LN + 0.5
        ) {
          rowSupport[rIdx + OFF] += len;
        }

        if (vm >= -1.5 && vm <= LN + 0.5) {
          const cMin = Math.ceil(Math.min(p1.x, p2.x) - 0.15);
          const cMax = Math.floor(Math.max(p1.x, p2.x) + 0.15);
          for (let c = Math.max(-5, cMin); c <= Math.min(maxIdx, cMax); c++) {
            colOrthoSpan[c + OFF] += 1;
          }
        }
      }

      for (const s of vSegsPx) {
        const p1 = applyH(Hinv, s.x1, s.y1);
        const p2 = applyH(Hinv, s.x2, s.y2);
        const um = (p1.x + p2.x) / 2;
        const vm = (p1.y + p2.y) / 2;
        const cIdx = Math.round(um);
        const len = Math.hypot(s.x2 - s.x1, s.y2 - s.y1);
        if (
          cIdx >= -5 &&
          cIdx <= maxIdx &&
          Math.abs(um - cIdx) < 0.28 &&
          vm >= -1.5 &&
          vm <= LN + 0.5
        ) {
          colSupport[cIdx + OFF] += len;
        }

        if (um >= -1.5 && um <= LN + 0.5) {
          const rMin = Math.ceil(Math.min(p1.y, p2.y) - 0.15);
          const rMax = Math.floor(Math.max(p1.y, p2.y) + 0.15);
          for (let r = Math.max(-5, rMin); r <= Math.min(maxIdx, rMax); r++) {
            rowOrthoSpan[r + OFF] += 1;
          }
        }
      }

      const findBestShift = (supArr, orthoArr) => {
        let maxS = 0;
        for (let i = 0; i < supArr.length; i++)
          if (supArr[i] > maxS) maxS = supArr[i];
        if (maxS < 15) return 0;
        const minLine = maxS * 0.06;
        let bestD = 0,
          bestScore = -1e9;
        for (let d = -3; d <= 3; d++) {
          let sc = 0;
          for (let k = 0; k < LN; k++) {
            const idx = k + d + OFF;
            const v = supArr[idx] || 0;
            const orthoCnt = orthoArr[idx] || 0;
            sc += v + Math.min(maxS * 0.25, orthoCnt * (maxS * 0.035));

            if (v < minLine && orthoCnt < 2) {
              sc -= maxS * (k === 0 || k === LN - 1 ? 1.25 : 0.7);
            }
          }
          for (const m of [1, 2, 3]) {
            const idxBefore = d - m + OFF;
            const idxAfter = d + (LN - 1) + m + OFF;
            const outBefore =
              (supArr[idxBefore] || 0) +
              ((orthoArr[idxBefore] || 0) >= 3 ? maxS * 0.3 : 0);
            const outAfter =
              (supArr[idxAfter] || 0) +
              ((orthoArr[idxAfter] || 0) >= 3 ? maxS * 0.3 : 0);
            if (outBefore > minLine) sc -= outBefore * 2.2;
            if (outAfter > minLine) sc -= outAfter * 2.2;
          }
          sc -= Math.abs(d) * maxS * 0.08;
          if (sc > bestScore) {
            bestScore = sc;
            bestD = d;
          }
        }
        return bestD;
      };

      const dr = findBestShift(rowSupport, rowOrthoSpan);
      const dc = findBestShift(colSupport, colOrthoSpan);
      if (dr === 0 && dc === 0) return pts;
      const shifted = Array.from({ length: LN }, (_, r) =>
        Array.from({ length: LN }, (_, c) => {
          const p = applyH(H, c + dc, r + dr);
          return {
            x: clamp(p.x, 1, P.w - 2),
            y: clamp(p.y, 1, P.h - 2),
          };
        }),
      );
      return shifted;
    }

    function applyH(H, x, y) {
      const den = H[6] * x + H[7] * y + H[8];
      return {
        x: (H[0] * x + H[1] * y + H[2]) / den,
        y: (H[3] * x + H[4] * y + H[5]) / den,
      };
    }
    function mat3mul(A, B) {
      const C = new Array(9).fill(0);
      for (let i = 0; i < 3; i++)
        for (let j = 0; j < 3; j++)
          for (let k = 0; k < 3; k++) C[i * 3 + j] += A[i * 3 + k] * B[k * 3 + j];
      return C;
    }
    function normParams(pts) {
      let mx = 0,
        my = 0;
      for (const p of pts) {
        mx += p.x;
        my += p.y;
      }
      mx /= pts.length;
      my /= pts.length;
      let d = 0;
      for (const p of pts) d += Math.hypot(p.x - mx, p.y - my);
      d /= pts.length;
      return { s: d > 0 ? Math.SQRT2 / d : 1, mx, my };
    }
    function fitHomographyLS(src, dst) {
      const ns = normParams(src),
        nd = normParams(dst);
      const ATA = Array.from({ length: 8 }, () => new Array(8).fill(0));
      const ATb = new Array(8).fill(0);
      const add = (row, val) => {
        for (let i = 0; i < 8; i++) {
          if (!row[i]) continue;
          ATb[i] += row[i] * val;
          for (let j = 0; j < 8; j++) ATA[i][j] += row[i] * row[j];
        }
      };
      for (let k = 0; k < src.length; k++) {
        const x = (src[k].x - ns.mx) * ns.s,
          y = (src[k].y - ns.my) * ns.s;
        const u = (dst[k].x - nd.mx) * nd.s,
          v = (dst[k].y - nd.my) * nd.s;
        add([x, y, 1, 0, 0, 0, -u * x, -u * y], u);
        add([0, 0, 0, x, y, 1, -v * x, -v * y], v);
      }
      const h = solve8(ATA, ATb);
      const Hn = [...h, 1];
      const Ts = [ns.s, 0, -ns.s * ns.mx, 0, ns.s, -ns.s * ns.my, 0, 0, 1];
      const TdInv = [1 / nd.s, 0, nd.mx, 0, 1 / nd.s, nd.my, 0, 0, 1];
      return mat3mul(mat3mul(TdInv, Hn), Ts);
    }

    function regularizeWithHomography(lat, src, supportedMask) {
      const minInliers = Math.max(9, Math.floor(LN * LN * 0.05));
      const supLat = [],
        supSrc = [];
      for (let k = 0; k < lat.length; k++) {
        if (!supportedMask || supportedMask[k]) {
          supLat.push(lat[k]);
          supSrc.push(src[k]);
        }
