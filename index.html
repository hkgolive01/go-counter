      }
      const useLat = supLat.length >= minInliers ? supLat : lat;
      const useSrc = supSrc.length >= minInliers ? supSrc : src;
      let H = fitHomographyLS(useLat, useSrc);
      const cellAt = (Hm, p) => {
        const a = applyH(Hm, p.x, p.y),
          b = applyH(Hm, p.x + 1, p.y);
        return Math.hypot(a.x - b.x, a.y - b.y);
      };
      for (let it = 0; it < 2; it++) {
        const inL = [],
          inS = [];
        for (let k = 0; k < useLat.length; k++) {
          const pr = applyH(H, useLat[k].x, useLat[k].y);
          const e = Math.hypot(pr.x - useSrc[k].x, pr.y - useSrc[k].y);
          if (e < 0.22 * cellAt(H, useLat[k])) {
            inL.push(useLat[k]);
            inS.push(useSrc[k]);
          }
        }
        if (inL.length < minInliers) break;
        H = fitHomographyLS(inL, inS);
      }
      const out = Array.from({ length: LN }, () => new Array(LN));
      for (let k = 0; k < lat.length; k++) {
        const pr = applyH(H, lat[k].x, lat[k].y);
        if (!isFinite(pr.x) || !isFinite(pr.y)) return null;
        const isSup = !supportedMask || supportedMask[k];
        const e = Math.hypot(pr.x - src[k].x, pr.y - src[k].y);
        out[lat[k].y][lat[k].x] =
          !isSup || e > 0.22 * cellAt(H, lat[k]) || !isFinite(src[k].x)
            ? pr
            : src[k];
      }
      return out;
    }

    function otsuThreshold(vals, lo, hi) {
      const B = 80;
      const hist = new Float64Array(B);
      for (const v of vals)
        hist[clamp(Math.floor(((v - lo) / (hi - lo)) * B), 0, B - 1)]++;
      const total = vals.length;
      let sum = 0;
      for (let i = 0; i < B; i++) sum += i * hist[i];
      let sumB = 0,
        wB = 0,
        max = -1,
        th = 0;
      for (let i = 0; i < B; i++) {
        wB += hist[i];
        if (!wB) continue;
        const wF = total - wB;
        if (!wF) break;
        sumB += i * hist[i];
        const mB = sumB / wB,
          mF = (sum - sumB) / wF;
        const between = wB * wF * (mB - mF) * (mB - mF);
        if (between > max) {
          max = between;
          th = i;
        }
      }
      return lo + ((th + 1) / B) * (hi - lo);
    }

    function classifyIntersections(P, pts, bc) {
      const n = LN;
      const { w, h, lum, sat } = P;
      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const cellAt = (i, j) => {
        let s = 0,
          c = 0;
        if (j < n - 1) {
          s += dist(pts[i][j], pts[i][j + 1]);
          c++;
        }
        if (j > 0) {
          s += dist(pts[i][j], pts[i][j - 1]);
          c++;
        }
        if (i < n - 1) {
          s += dist(pts[i][j], pts[i + 1][j]);
          c++;
        }
        if (i > 0) {
          s += dist(pts[i][j], pts[i - 1][j]);
          c++;
        }
        return s / c;
      };
      const sample = (cx, cy, r) => {
        const Ls = [],
          Ss = [];
        const st = Math.max(1, Math.floor(r / 7));
        const r2 = r * r;
        for (let dy = -r; dy <= r; dy += st)
          for (let dx = -r; dx <= r; dx += st) {
            if (dx * dx + dy * dy > r2) continue;
            const x = Math.round(cx + dx),
              y = Math.round(cy + dy);
            if (x < 0 || y < 0 || x >= w || y >= h) continue;
            const i = y * w + x;
            Ls.push(lum[i]);
            Ss.push(sat[i]);
          }
        return { L: Ls.length ? median(Ls) : -1, S: Ss.length ? median(Ss) : 0 };
      };

      const cen = [];
      for (let ci = 0; ci < n - 1; ci++) {
        const row = [];
        for (let cj = 0; cj < n - 1; cj++) {
          const a = pts[ci][cj],
            b = pts[ci][cj + 1],
            c = pts[ci + 1][cj],
            d = pts[ci + 1][cj + 1];
          const px = (a.x + b.x + c.x + d.x) / 4,
            py = (a.y + b.y + c.y + d.y) / 4;
          const cs = (cellAt(ci, cj) + cellAt(ci + 1, cj + 1)) / 2;
          row.push(sample(px, py, Math.max(2, cs * 0.13)));
        }
        cen.push(row);
      }

      const feats = [];
      for (let i = 0; i < n; i++)
        for (let j = 0; j < n; j++) {
          const c = cellAt(i, j);
          const s = sample(pts[i][j].x, pts[i][j].y, Math.max(3, c * 0.27));
          let refs = [];
          for (let ci = Math.max(0, i - 2); ci <= Math.min(n - 2, i + 1); ci++)
            for (let cj = Math.max(0, j - 2); cj <= Math.min(n - 2, j + 1); cj++) {
              const r = cen[ci][cj];
              if (r.L >= bc.L * 0.5) refs.push(r);
            }
          let refL = bc.L,
            refS = bc.S;
          if (refs.length) {
            let sel;
            if (bc.useHue)
              sel = refs
                .slice()
                .sort((a, b) => b.S - a.S)
                .slice(0, Math.max(1, Math.ceil(refs.length / 2)));
            else
              sel = refs
                .slice()
                .sort((a, b) => Math.abs(a.L - bc.L) - Math.abs(b.L - bc.L))
                .slice(0, Math.max(1, Math.ceil(refs.length / 2)));
            refL = median(sel.map((r) => r.L));
            refS = median(sel.map((r) => r.S));
          }
          const L = s.L < 0 ? refL : s.L;
          const rL = L / Math.max(20, refL);
          const rS = refS > 0.05 ? s.S / refS : 1;
          const ws = bc.useHue ? rL - 1 + (1 - Math.min(1.5, rS)) * 0.6 : rL - 1;
          feats.push({ i, j, rL, ws, dL: refL - L });
        }

      const thB = clamp(
        otsuThreshold(
          feats.map((f) => f.rL),
          0.1,
          1.6,
        ),
        0.45,
        0.74,
      );
      const isBlack = (f) => f.rL < thB && f.dL > 30;
      const rest = feats.filter((f) => !isBlack(f));
      const wlo = bc.useHue ? 0.2 : 0.1,
        whi = bc.useHue ? 0.5 : 0.35;
      const thW = clamp(
        otsuThreshold(
          rest.map((f) => f.ws),
          -0.6,
          1.6,
        ),
        wlo,
        whi,
      );

      const board = Array.from({ length: n }, () => Array(n).fill(0));
      const confidence = Array.from({ length: n }, () => Array(n).fill(0.5));
      for (const f of feats) {
        if (isBlack(f)) {
          board[f.i][f.j] = 1;
          confidence[f.i][f.j] = clamp(0.5 + (thB - f.rL) * 2, 0.5, 0.99);
        } else if (f.ws > thW && f.rL > 0.9) {
          board[f.i][f.j] = 2;
          confidence[f.i][f.j] = clamp(0.5 + (f.ws - thW) * 1.5, 0.5, 0.99);
        } else {
          confidence[f.i][f.j] = clamp(
            0.5 + Math.min(thW - f.ws, f.rL - thB),
            0.5,
            0.99,
          );
        }
      }
      return { board, confidence };
    }

    function extractVerifiedGridSubSegments(P, bc, pts, board, scale) {
      const { w, h, lum, sat } = P;
      const Lmin = bc.L * 0.5,
        Lmax = Math.min(242, bc.L * 1.4);
      const satMin = bc.useHue ? bc.S * 0.38 : -1;

      const stoneCircles = [];
      for (let r = 0; r < LN; r++) {
        for (let c = 0; c < LN; c++) {
          if (board[r][c] === 0) continue;
          const p = pts[r][c];
          const nb = c < LN - 1 ? pts[r][c + 1] : pts[r][c - 1];
          const cell = Math.hypot(p.x - nb.x, p.y - nb.y);
          stoneCircles.push({
            x: p.x,
            y: p.y,
            r2: cell * 0.43 * (cell * 0.43),
          });
        }
      }

      const isInsideAnyStone = (x, y) => {
        for (const sc of stoneCircles) {
          const dx = x - sc.x,
            dy = y - sc.y;
          if (dx * dx + dy * dy <= sc.r2) return true;
        }
        return false;
      };

      const isBoardAt = (x, y) => {
        const ix = Math.round(x),
          iy = Math.round(y);
        if (ix < 0 || iy < 0 || ix >= w || iy >= h) return false;
        const idx = iy * w + ix;
        return (
          lum[idx] >= Lmin &&
          lum[idx] <= Lmax &&
          sat[idx] >= satMin &&
          (!bc.useHue || hueDist(P.hue[idx], bc.hue) < 26)
        );
      };

      const lumAt = (x, y) => {
        const ix = clamp(Math.round(x), 0, w - 1);
        const iy = clamp(Math.round(y), 0, h - 1);
        return lum[iy * w + ix];
      };

      const traceLinePoints = (linePts) => {
        const subSegs = [];
        let activeRun = [];
        let missCount = 0;

        const flushRun = (minPx) => {
          if (activeRun.length >= minPx) {
            const first = activeRun[0];
            const last = activeRun[activeRun.length - 1];
            const len = Math.hypot(last.x - first.x, last.y - first.y);
            if (len >= minPx) {
              subSegs.push({
                x1: first.x / scale,
                y1: first.y / scale,
                x2: last.x / scale,
                y2: last.y / scale,
                verified: true,
                source: "grid",
              });
            }
          }
          activeRun = [];
          missCount = 0;
        };

        for (let k = 0; k < LN - 1; k++) {
          const a = linePts[k],
            b = linePts[k + 1];
          const dx = b.x - a.x,
            dy = b.y - a.y;
          const spanLen = Math.hypot(dx, dy);
          if (spanLen < 3) continue;

          const minSegPx = Math.max(4, Math.round(spanLen * 0.22));
          const steps = Math.max(4, Math.ceil(spanLen));
          const ux = dx / spanLen,
            uy = dy / spanLen;
          const nx = -uy,
            ny = ux;
          const d = clamp(Math.round(spanLen * 0.14), 2, 5);

          for (let s = 0; s <= steps; s++) {
            const px = a.x + (dx * s) / steps;
            const py = a.y + (dy * s) / steps;

            if (isInsideAnyStone(px, py)) {
              flushRun(minSegPx);
              continue;
            }

            let bestCenterL = 255,
              bestOff = 0;
            for (const off of [-1.5, -0.75, 0, 0.75, 1.5]) {
              const cl = lumAt(px + nx * off, py + ny * off);
              if (cl < bestCenterL) {
                bestCenterL = cl;
                bestOff = off;
              }
            }
            const cx = px + nx * bestOff,
              cy = py + ny * bestOff;
            const s1x = cx + nx * d,
              s1y = cy + ny * d;
            const s2x = cx - nx * d,
              s2y = cy - ny * d;

            let hasDarkLine = false;
            if (isBoardAt(s1x, s1y) && isBoardAt(s2x, s2y)) {
              const l1 = lumAt(s1x, s1y),
                l2 = lumAt(s2x, s2y);
              if (Math.abs(l1 - l2) <= 38) {
                const sideMin = Math.min(l1, l2);
                const dip = sideMin - bestCenterL;
                if (dip >= 7.0 && bestCenterL <= sideMin * 0.9) {
                  hasDarkLine = true;
                }
              }
            }

            if (hasDarkLine) {
              activeRun.push({ x: cx, y: cy });
              missCount = 0;
            } else {
              missCount++;
              if (missCount > 1) {
                flushRun(minSegPx);
              }
            }
          }
        }
        flushRun(5);
        return subSegs;
      };

      const out = [];
      for (let i = 0; i < LN; i++) {
        out.push(...traceLinePoints(pts[i]));
      }
      for (let j = 0; j < LN; j++) {
        const colPts = [];
        for (let i = 0; i < LN; i++) colPts.push(pts[i][j]);
        out.push(...traceLinePoints(colPts));
      }
      return out;
    }

    function mergeLineSegments(gridSegs, rawSegs, pts, board, scale) {
      const out = gridSegs.slice();
      if (!rawSegs || !rawSegs.length) return out;

      const stones = [];
      for (let r = 0; r < LN; r++) {
        for (let c = 0; c < LN; c++) {
          if (board[r][c] === 0) continue;
          const p = pts[r][c];
          const nb = c < LN - 1 ? pts[r][c + 1] : pts[r][c - 1];
          const cell = Math.hypot(p.x - nb.x, p.y - nb.y) / scale;
          stones.push({
            x: p.x / scale,
            y: p.y / scale,
            r2: cell * 0.45 * (cell * 0.45),
          });
        }
      }
      const hitsStone = (x, y) => {
        for (const st of stones) {
          const dx = x - st.x,
            dy = y - st.y;
          if (dx * dx + dy * dy <= st.r2) return true;
        }
        return false;
      };

      for (const rs of rawSegs) {
        const mx = (rs.x1 + rs.x2) / 2,
          my = (rs.y1 + rs.y2) / 2;
        if (hitsStone(rs.x1, rs.y1) || hitsStone(rs.x2, rs.y2) || hitsStone(mx, my))
          continue;

        let dup = false;
        for (const gs of gridSegs) {
          const gmx = (gs.x1 + gs.x2) / 2,
            gmy = (gs.y1 + gs.y2) / 2;
          if (Math.hypot(mx - gmx, my - gmy) < 8) {
            dup = true;
            break;
          }
        }
        if (!dup) out.push(rs);
      }
      return out;
    }

    function resizeImage(imgSource, maxSide) {
      const w0 = imgSource.naturalWidth || imgSource.width;
      const h0 = imgSource.naturalHeight || imgSource.height;
      const scale = Math.min(1, maxSide / Math.max(w0, h0));
      const width = Math.round(w0 * scale);
      const height = Math.round(h0 * scale);
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(imgSource, 0, 0, width, height);
      return { canvas, scale, width, height };
    }

    function polygonArea(pts) {
      let a = 0;
      for (let i = 0; i < pts.length; i++) {
        const j = (i + 1) % pts.length;
        a += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
      }
      return Math.abs(a) / 2;
    }

    function computeHomography(src, dst) {
      const A = [],
        B = [];
      for (let i = 0; i < 4; i++) {
        const sx = src[i].x,
          sy = src[i].y,
          dx = dst[i].x,
          dy = dst[i].y;
        A.push([sx, sy, 1, 0, 0, 0, -dx * sx, -dx * sy]);
        B.push(dx);
        A.push([0, 0, 0, sx, sy, 1, -dy * sx, -dy * sy]);
        B.push(dy);
      }
      const h = solve8(A, B);
      return [...h, 1];
    }

    function solve8(A, B) {
      const n = 8,
        M = A.map((r, i) => [...r, B[i]]);
      for (let i = 0; i < n; i++) {
        let max = i;
        for (let k = i + 1; k < n; k++)
          if (Math.abs(M[k][i]) > Math.abs(M[max][i])) max = k;
        [M[i], M[max]] = [M[max], M[i]];
        const piv = M[i][i] || 1e-12;
        for (let j = i; j <= n; j++) M[i][j] /= piv;
        for (let k = 0; k < n; k++)
          if (k !== i) {
            const f = M[k][i];
            for (let j = i; j <= n; j++) M[k][j] -= f * M[i][j];
          }
      }
      return M.map((r) => r[n]);
    }

    /* =========================================================================
     * 4. 圍棋死活判定與中國數子規則計算引擎
     * ========================================================================= */
    function inBounds(r, c) {
      return r >= 0 && r < N && c >= 0 && c < N;
    }

    function isProtectedPoint(board, r, c, color) {
      const enemy = 3 - color;
      let friendCnt = 0;
      for (const [dr, dc] of DIRS_4) {
        const nr = r + dr,
          nc = c + dc;
        if (!inBounds(nr, nc)) friendCnt += 0.5;
        else if (board[nr][nc] === enemy) return false;
        else if (board[nr][nc] === color) friendCnt++;
      }
      return friendCnt >= 2;
    }

    function extractChainsAndLinks(board) {
      const chainIdGrid = Array.from({ length: N }, () => Array(N).fill(-1));
      const chains = [];
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const color = board[r][c];
          if (color === 0 || chainIdGrid[r][c] !== -1) continue;
          const id = chains.length;
          const stones = [];
          const liberties = new Set();
          const queue = [[r, c]];
          chainIdGrid[r][c] = id;
          while (queue.length) {
            const [cr, cc] = queue.shift();
            stones.push([cr, cc]);
            for (const [dr, dc] of DIRS_4) {
              const nr = cr + dr,
                nc = cc + dc;
              if (!inBounds(nr, nc)) continue;
              if (board[nr][nc] === 0) liberties.add(`${nr},${nc}`);
              else if (board[nr][nc] === color && chainIdGrid[nr][nc] === -1) {
                chainIdGrid[nr][nc] = id;
                queue.push([nr, nc]);
              }
            }
          }
          chains.push({
            id,
            color,
            stones,
            liberties,
            neighbors: new Set(),
            friendlyLinks: new Set(),
            wallLinks: new Set(),
            eyeScore: 0,
            isAlive: false,
            isSeki: false,
          });
        }
      }

      const KNIGHT_DIRS = [
        [2, 1],
        [2, -1],
        [1, 2],
        [-1, 2],
      ];

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const idA = chainIdGrid[r][c];
          if (idA === -1) continue;
          const colorA = chains[idA].color;
          const enemy = 3 - colorA;

          for (const [dr, dc] of DIRS_4) {
            const nr = r + dr,
              nc = c + dc;
            if (!inBounds(nr, nc)) continue;
            const idB = chainIdGrid[nr][nc];
            if (idB !== -1 && idB !== idA && chains[idB].color === enemy) {
              chains[idA].neighbors.add(idB);
            }
          }

          for (const [dr, dc] of DIRS_DIAG) {
            const nr = r + dr,
              nc = c + dc;
            if (!inBounds(nr, nc)) continue;
            const idB = chainIdGrid[nr][nc];
            if (idB === -1 || idB === idA || chains[idB].color !== colorA) continue;

            const s1 = board[r + dr][c];
            const s2 = board[r][c + dc];
            if (s1 === enemy && s2 === enemy) continue;

            chains[idA].wallLinks.add(idB);
            chains[idB].wallLinks.add(idA);

            const bothEmpty = s1 === 0 && s2 === 0;
            const safeOneSide =
              (s1 === 0 &&
                s2 !== enemy &&
                isProtectedPoint(board, r + dr, c, colorA)) ||
              (s2 === 0 &&
                s1 !== enemy &&
                isProtectedPoint(board, r, c + dc, colorA));
            const oneEmptyProtected =
              (s1 === 0 && isProtectedPoint(board, r + dr, c, colorA)) ||
              (s2 === 0 && isProtectedPoint(board, r, c + dc, colorA));

            if (bothEmpty || safeOneSide || oneEmptyProtected) {
              chains[idA].friendlyLinks.add(idB);
              chains[idB].friendlyLinks.add(idA);
            }
          }

          for (const [dr, dc] of [
            [2, 0],
            [0, 2],
          ]) {
            const nr = r + dr,
              nc = c + dc;
            if (!inBounds(nr, nc)) continue;
            const idB = chainIdGrid[nr][nc];
            const mr = r + (dr >> 1),
              mc = c + (dc >> 1);
            if (
              idB !== -1 &&
              idB !== idA &&
              chains[idB].color === colorA &&
              board[mr][mc] === 0
            ) {
              let enemyCut = 0;
              let friendGuard = 0;
              for (const [pdr, pdc] of DIRS_4) {
                const pr = mr + pdr,
                  pc = mc + pdc;
                if (!inBounds(pr, pc)) friendGuard++;
                else if (board[pr][pc] === enemy) enemyCut++;
                else if (board[pr][pc] === colorA) friendGuard++;
              }
              if (enemyCut <= 1) {
                chains[idA].wallLinks.add(idB);
                chains[idB].wallLinks.add(idA);
                if (
                  (enemyCut === 0 && friendGuard >= 2) ||
                  (enemyCut === 1 && friendGuard >= 3)
                ) {
                  chains[idA].friendlyLinks.add(idB);
                  chains[idB].friendlyLinks.add(idA);
                }
              }
            }
          }

          for (const [dr, dc] of KNIGHT_DIRS) {
            const nr = r + dr,
              nc = c + dc;
            if (!inBounds(nr, nc)) continue;
            const idB = chainIdGrid[nr][nc];
            if (idB === -1 || idB === idA || chains[idB].color !== colorA) continue;
            const m1r = Math.abs(dr) === 2 ? r + (dr >> 1) : r;
            const m1c = Math.abs(dc) === 2 ? c + (dc >> 1) : c;
            const m2r = Math.abs(dr) === 2 ? r + (dr >> 1) : nr;
            const m2c = Math.abs(dc) === 2 ? nc : c + (dc >> 1);
            if (board[m1r][m1c] === 0 && board[m2r][m2c] === 0) {
              chains[idA].wallLinks.add(idB);
              chains[idB].wallLinks.add(idA);
              if (
                isProtectedPoint(board, m1r, m1c, colorA) ||
                isProtectedPoint(board, m2r, m2c, colorA) ||
                (chains[idA].liberties.size >= 3 && chains[idB].liberties.size >= 3)
              ) {
                chains[idA].friendlyLinks.add(idB);
                chains[idB].friendlyLinks.add(idA);
              }
            }
          }
        }
      }

      for (let i = 0; i < chains.length; i++) {
        for (let j = i + 1; j < chains.length; j++) {
          if (chains[i].color !== chains[j].color) continue;
          const color = chains[i].color;
          let shared = 0;
          let protectedShared = 0;
          for (const lib of chains[i].liberties) {
            if (chains[j].liberties.has(lib)) {
              shared++;
              const [lr, lc] = lib.split(",").map(Number);
              if (isProtectedPoint(board, lr, lc, color)) protectedShared++;
            }
          }
          if (shared >= 2) {
            chains[i].wallLinks.add(j);
            chains[j].wallLinks.add(i);
          }
          if (shared >= 3 || protectedShared >= 1) {
            chains[i].friendlyLinks.add(j);
            chains[j].friendlyLinks.add(i);
            chains[i].wallLinks.add(j);
            chains[j].wallLinks.add(i);
          }
        }
      }

      return { chains, chainIdGrid };
    }

    function isTrueEyePoint(board, r, c, ownerColor, deadStones) {
      const enemy = 3 - ownerColor;
      for (const [dr, dc] of DIRS_4) {
        const nr = r + dr,
          nc = c + dc;
        if (!inBounds(nr, nc)) continue;
        const v = deadStones.has(`${nr},${nc}`) ? 0 : board[nr][nc];
        if (v === enemy) return false;
      }
      let diagTotal = 0,
        enemyDiag = 0;
      for (const [dr, dc] of DIRS_DIAG) {
        const nr = r + dr,
          nc = c + dc;
        if (!inBounds(nr, nc)) continue;
        diagTotal++;
        const v = deadStones.has(`${nr},${nc}`) ? 0 : board[nr][nc];
        if (v === enemy) enemyDiag++;
      }
      if (diagTotal <= 2) return enemyDiag === 0;
      return enemyDiag <= 1;
    }

    function evaluateEyeSpaceComprehensive(
      regionCoords,
      board,
      ownerColor,
      deadStones,
      internalEnemyDeadCount,
    ) {
      const totalSize = regionCoords.length;
      if (totalSize === 0 || totalSize > 28) return 0;

      const truePts = regionCoords.filter(([r, c]) =>
        isTrueEyePoint(board, r, c, ownerColor, deadStones),
      );
      if (truePts.length === 0) return 0;

      if (totalSize === 1) return 1.0;
      if (totalSize === 2) {
        return internalEnemyDeadCount > 0 ? 1.35 : 1.0;
      }

      const ptSet = new Set(regionCoords.map(([r, c]) => `${r},${c}`));
      const degs = [];
      let minR = N,
        maxR = -1,
        minC = N,
        maxC = -1;
      let touchCorner = false;
      for (const [r, c] of regionCoords) {
        minR = Math.min(minR, r);
        maxR = Math.max(maxR, r);
        minC = Math.min(minC, c);
        maxC = Math.max(maxC, c);
        if ((r === 0 || r === N - 1) && (c === 0 || c === N - 1))
          touchCorner = true;
        let d = 0;
        for (const [dr, dc] of DIRS_4) if (ptSet.has(`${r + dr},${c + dc}`)) d++;
        degs.push(d);
      }
      degs.sort((a, b) => a - b);
      const sig = degs.join(",");
      const boxH = maxR - minR + 1,
        boxW = maxC - minC + 1;

      if (totalSize === 3) {
        return internalEnemyDeadCount > 0 ? 1.05 : 1.5;
      }
      if (totalSize === 4) {
        if (sig === "2,2,2,2" && boxH === 2 && boxW === 2) return 1.0;
        if (sig === "1,1,1,3") return internalEnemyDeadCount > 0 ? 1.05 : 1.5;
        if (touchCorner && boxH <= 2 && boxW <= 3)
          return internalEnemyDeadCount > 0 ? 1.2 : 1.55;
        return internalEnemyDeadCount > 0 ? 1.4 : 1.9;
      }
      if (totalSize === 5) {
        if (sig === "1,1,1,1,4" || sig === "1,2,2,2,3")
          return internalEnemyDeadCount > 0 ? 1.15 : 1.6;
        return 2.0;
      }
      if (totalSize === 6) {
        if (degs[5] === 4 && boxH === 3 && boxW === 3)
          return internalEnemyDeadCount > 0 ? 1.2 : 1.7;
        return 2.0;
      }
      return 2.2;
    }

    function isNakadeDeadShape(coords) {
      const n = coords.length;
      if (n < 3 || n > 6) return false;
      const ptSet = new Set(coords.map(([r, c]) => `${r},${c}`));
      const degs = [];
      let minR = N, maxR = -1, minC = N, maxC = -1;
      for (const [r, c] of coords) {
        if (r < minR) minR = r;
        if (r > maxR) maxR = r;
        if (c < minC) minC = c;
        if (c > maxC) maxC = c;
        let d = 0;
        for (const [dr, dc] of DIRS_4) {
          if (ptSet.has(`${r + dr},${c + dc}`)) d++;
        }
        degs.push(d);
      }
      degs.sort((a, b) => a - b);
      const sig = degs.join(",");
      const boxH = maxR - minR + 1;
      const boxW = maxC - minC + 1;
      if (n === 3) return sig === "1,1,2";
      if (n === 4) {
        if (sig === "1,1,1,3") return true;
        if (sig === "2,2,2,2" && boxH === 2 && boxW === 2) return true;
        return false;
      }
      if (n === 5) {
        if (sig === "1,1,1,1,4") return true;
        if (sig === "1,2,2,2,3" && Math.max(boxH, boxW) === 3 && Math.min(boxH, boxW) === 2) {
          return true;
        }
        return false;
      }
      if (n === 6) {
        return degs[5] === 4 && boxH === 3 && boxW === 3;
      }
      return false;
    }

    function canKillByDeadShapePlusOne(innerChain, sharedLibCoords) {
      const n = innerChain.stones.length;
      if (n <= 2) return true;
      if (n >= 6) return false;
      if (!isNakadeDeadShape(innerChain.stones)) return false;
      for (const lib of sharedLibCoords) {
        if (isNakadeDeadShape([...innerChain.stones, lib])) {
          return true;
        }
      }
      return false;
    }

    function detectSekiChains(chains, workBoard) {
      const countTruePrivateLibs = (ch) => {
        const enemy = 3 - ch.color;
        let cnt = 0;
        for (const lib of ch.liberties) {
          const [lr, lc] = lib.split(",").map(Number);
          let touchEnemy = false;
          for (const [dr, dc] of DIRS_4) {
            const nr = lr + dr, nc = lc + dc;
            if (inBounds(nr, nc) && workBoard[nr][nc] === enemy) {
              touchEnemy = true;
              break;
            }
          }
          if (!touchEnemy) cnt++;
        }
        return cnt;
      };
      for (let i = 0; i < chains.length; i++) {
        const chA = chains[i];
        if (chA.isAlive || chA.liberties.size === 0 || chA.stones.length < 3)
          continue;
        const truePrivA = countTruePrivateLibs(chA);
        for (const nbId of chA.neighbors) {
          const chB = chains[nbId];
          if (chB.isAlive || chB.liberties.size === 0 || chB.stones.length < 3)
            continue;
          const sharedCoords = [];
          for (const lib of chA.liberties) {
            if (chB.liberties.has(lib)) {
              sharedCoords.push(lib.split(",").map(Number));
            }
          }
          const shared = sharedCoords.length;
          if (shared < 2) continue;
          const truePrivB = countTruePrivateLibs(chB);
          const smaller = chA.stones.length <= chB.stones.length ? chA : chB;
          const noEyeSeki =
            shared >= 2 && truePrivA === 0 && truePrivB === 0;
          const oneEyeSeki =
            shared >= 1 &&
            chA.eyeScore >= 0.85 &&
            chB.eyeScore >= 0.85 &&
            truePrivA <= 1 &&
            truePrivB <= 1;
          if (
            (noEyeSeki || oneEyeSeki) &&
            !canKillByDeadShapePlusOne(smaller, sharedCoords)
          ) {
            chA.isAlive = chB.isAlive = true;
            chA.isSeki = chB.isSeki = true;
          }
        }
      }
    }

    function computeDualInfluenceField(board) {
      let inf = Array.from({ length: N }, () => new Float32Array(N));
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (board[r][c] === 1) inf[r][c] = 100;
          else if (board[r][c] === 2) inf[r][c] = -100;
        }
      }
      for (let step = 0; step < 22; step++) {
        const next = Array.from({ length: N }, () => new Float32Array(N));
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            if (board[r][c] === 1) {
              next[r][c] = 100;
              continue;
            }
            if (board[r][c] === 2) {
              next[r][c] = -100;
              continue;
            }
            let sum = inf[r][c] * 1.2,
              weight = 1.2;
            for (const [dr, dc] of DIRS_4) {
              const nr = r + dr,
                nc = c + dc;
              if (!inBounds(nr, nc)) continue;
              sum += inf[nr][nc];
              weight += 1.0;
            }
            for (const [dr, dc] of DIRS_DIAG) {
              const nr = r + dr,
                nc = c + dc;
              if (!inBounds(nr, nc)) continue;
              sum += inf[nr][nc] * 0.4;
              weight += 0.4;
            }
            next[r][c] = (sum / weight) * 0.975;
          }
        }
        inf = next;
      }
      return inf;
    }

    function analyzeDragonEnvironment(
      workBoard,
      chains,
      chainIdGrid,
      dragonIdOfChain,
      dragons,
      targetDragon,
    ) {
      const memberChainIds = new Set(targetDragon.chains.map((ch) => ch.id));
      const visitedEmpty = new Set();
      const q = [];

      for (const lib of targetDragon.liberties) {
        visitedEmpty.add(lib);
        const [lr, lc] = lib.split(",").map(Number);
        q.push([lr, lc, 1]);
      }

      let emptyReached = 0;
      const touchedFriendChains = new Map();
      const touchedEnemyChains = new Map();
      let boundaryFriendHits = 0;
      let boundaryEnemyHits = 0;

      for (const ch of targetDragon.chains) {
        for (const nbCid of ch.neighbors) {
          if (memberChainIds.has(nbCid)) continue;
          touchedEnemyChains.set(nbCid, 1);
          boundaryEnemyHits += 1.2;
        }
      }

      while (q.length && visitedEmpty.size < 140) {
        const [cr, cc, dist] = q.shift();
        emptyReached++;

        for (const [dr, dc] of DIRS_4) {
          const nr = cr + dr,
            nc = cc + dc;
          if (!inBounds(nr, nc)) continue;
          const cid = chainIdGrid[nr][nc];
          if (cid !== -1) {
            if (memberChainIds.has(cid)) continue;
            const decay = 1.0 / (1.0 + (dist - 1) * 0.28);
            if (chains[cid].color === targetDragon.color) {
              boundaryFriendHits += decay;
              if (
                !touchedFriendChains.has(cid) ||
                dist < touchedFriendChains.get(cid)
              ) {
                touchedFriendChains.set(cid, dist);
              }
            } else {
              boundaryEnemyHits += decay;
              if (
                !touchedEnemyChains.has(cid) ||
                dist < touchedEnemyChains.get(cid)
              ) {
                touchedEnemyChains.set(cid, dist);
              }
            }
          } else if (dist < 9) {
            const nk = `${nr},${nc}`;
            if (!visitedEmpty.has(nk)) {
              visitedEmpty.add(nk);
              q.push([nr, nc, dist + 1]);
            }
          }
        }
      }

      let friendlyWallWeight = 0;
      let aliveFriendWeight = 0;
      for (const [cid, dist] of touchedFriendChains.entries()) {
        const ch = chains[cid];
        const dObj = dragons[dragonIdOfChain[cid]];
        const scaleW = Math.min(
          12,
          ch.stones.length + (ch.liberties.size >= 4 ? 3 : 0),
        );
        const w = scaleW / (1.0 + (dist - 1) * 0.25);
        friendlyWallWeight += w;
        if ((dObj && dObj.isAlive) || ch.isAlive) {
          aliveFriendWeight += w * 1.5;
        }
      }

      let enemyWallWeight = 0;
      let aliveEnemyWallWeight = 0;
      const touchedEnemyDragons = new Set();
      for (const [cid, dist] of touchedEnemyChains.entries()) {
        const ch = chains[cid];
        const dId = dragonIdOfChain[cid];
        const dObj = dragons[dId];
        if (dId !== undefined && dId !== -1) touchedEnemyDragons.add(dId);
        const maxCap = dist === 1 ? 26 : 14;
        const scaleW = Math.min(
          maxCap,
          ch.stones.length + (ch.liberties.size >= 4 ? 3 : 0),
        );
        const w = scaleW / (1.0 + (dist - 1) * 0.25);
        enemyWallWeight += w;
        if ((dObj && dObj.isAlive) || ch.isAlive) {
          aliveEnemyWallWeight += w;
        }
      }

      return {
        emptyReached,
        friendlyWallWeight,
        aliveFriendWeight,
        enemyWallWeight,
        aliveEnemyWallWeight,
        boundaryFriendHits,
        boundaryEnemyHits,
        touchedEnemyDragons,
      };
    }

    function sweepTrappedRemnants(rawBoard, deadStones, maxGroupSize = 18) {
      let changed = false;
      const workBoard = Array.from({ length: N }, (_, r) =>
        Array.from({ length: N }, (_, c) =>
          deadStones.has(`${r},${c}`) ? 0 : rawBoard[r][c],
        ),
      );

      const { chains, chainIdGrid } = extractChainsAndLinks(workBoard);
      if (!chains.length) return false;
      detectSekiChains(chains, workBoard);

      const strongWall = new Uint8Array(chains.length);
      for (let i = 0; i < chains.length; i++) {
        if (chains[i].stones.length >= 5 && chains[i].liberties.size >= 4) {
          strongWall[i] = 1;
        } else if (chains[i].stones.length >= 8 && chains[i].liberties.size >= 3) {
          strongWall[i] = 1;
        }
      }
      for (let iter = 0; iter < 3; iter++) {
        for (let i = 0; i < chains.length; i++) {
          if (!strongWall[i]) continue;
          for (const nb of chains[i].wallLinks) {
            if (chains[nb].liberties.size >= 2) strongWall[nb] = 1;
          }
        }
      }

      for (let i = 0; i < chains.length; i++) {
        const ch = chains[i];
        if (ch.isSeki || ch.stones.length > maxGroupSize) continue;

        const groupChains = [ch];
        const seenC = new Set([i]);
        const cq = [i];
        while (cq.length) {
          const cur = cq.shift();
          for (const nb of chains[cur].friendlyLinks) {
            if (!seenC.has(nb)) {
              seenC.add(nb);
              groupChains.push(chains[nb]);
              cq.push(nb);
            }
          }
        }

        if (groupChains.some((gc) => gc.isSeki)) continue;

        let totalStones = 0;
        const groupLibs = new Set();
        const visited = new Set();
        const q = [];
        for (const gc of groupChains) {
          totalStones += gc.stones.length;
          for (const lib of gc.liberties) groupLibs.add(lib);
          for (const [r, c] of gc.stones) {
            visited.add(`${r},${c}`);
          }
        }
        if (totalStones > maxGroupSize || groupLibs.size >= 9) continue;

        let pureInternalEyes = 0;
        for (const lib of groupLibs) {
          const [lr, lc] = lib.split(",").map(Number);
          if (isTrueEyePoint(workBoard, lr, lc, ch.color, deadStones)) {
            pureInternalEyes++;
          }
          visited.add(lib);
          q.push([lr, lc, 1]);
        }
        if (pureInternalEyes >= 2) continue;

        let friendlyWallHits = 0;
        let enemyWallHits = 0;
        let emptyReached = groupLibs.size;

        while (q.length && visited.size < 110) {
          const [cr, cc, dist] = q.shift();
          if (dist >= 8) continue;
          for (const [dr, dc] of DIRS_4) {
            const nr = cr + dr,
              nc = cc + dc;
            if (!inBounds(nr, nc)) continue;
            const nk = `${nr},${nc}`;
            const cid = chainIdGrid[nr][nc];
            if (cid !== -1) {
              if (seenC.has(cid)) continue;
              if (strongWall[cid] || chains[cid].stones.length >= 3) {
                const w =
                  Math.min(5, chains[cid].stones.length) / (1 + (dist - 1) * 0.2);
                if (chains[cid].color === ch.color) friendlyWallHits += w;
                else enemyWallHits += w;
              }
              continue;
            }
            if (!visited.has(nk) && workBoard[nr][nc] === 0) {
              visited.add(nk);
              emptyReached++;
              q.push([nr, nc, dist + 1]);
            }
          }
        }

        const completelyDominatedInOpen =
          totalStones <= 8 && friendlyWallHits < 1.0 && enemyWallHits >= 12;

        const trappedInPocket =
          enemyWallHits >= 5.5 &&
          (friendlyWallHits === 0 || enemyWallHits >= friendlyWallHits * 3.8) &&
          emptyReached <= Math.min(22, totalStones * 2 + 8);

        if (trappedInPocket || completelyDominatedInOpen) {
          for (const gc of groupChains) {
            for (const [sr, sc] of gc.stones) {
              const k = `${sr},${sc}`;
              if (!deadStones.has(k)) {
                deadStones.add(k);
                changed = true;
              }
            }
          }
        }
      }
      return changed;
    }

    function analyzeAndScoreChineseGo(rawBoard, manualDeadStones = new Set()) {
      N = rawBoard.length;
      const deadStones = new Set(manualDeadStones);

      sweepTrappedRemnants(rawBoard, deadStones, 3);

      for (let pass = 0; pass < 5; pass++) {
        const workBoard = Array.from({ length: N }, (_, r) =>
          Array.from({ length: N }, (_, c) =>
            deadStones.has(`${r},${c}`) ? 0 : rawBoard[r][c],
          ),
        );
        const { chains, chainIdGrid } = extractChainsAndLinks(workBoard);
        if (!chains.length) break;

        const { territoryOwner: sealedOwner } =
          buildVirtualSealedRegions(workBoard);

        const visitedSmallEye = Array.from({ length: N }, () =>
          Array(N).fill(false),
        );
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            if (workBoard[r][c] !== 0 || visitedSmallEye[r][c]) continue;
            const q = [[r, c]];
            visitedSmallEye[r][c] = true;
            const coords = [];
            const touchBChains = new Set();
            const touchWChains = new Set();
            while (q.length) {
              const [cr, cc] = q.shift();
              coords.push([cr, cc]);
              for (const [dr, dc] of DIRS_4) {
                const nr = cr + dr,
                  nc = cc + dc;
                if (!inBounds(nr, nc)) continue;
                const cid = chainIdGrid[nr][nc];
                if (cid !== -1) {
                  if (chains[cid].color === 1) touchBChains.add(cid);
                  else touchWChains.add(cid);
                } else if (
                  !visitedSmallEye[nr][nc] &&
                  sealedOwner[nr][nc] === sealedOwner[r][c]
                ) {
                  visitedSmallEye[nr][nc] = true;
                  q.push([nr, nc]);
                }
              }
            }
            if (coords.length <= 10) {
              if (touchBChains.size > 1 && touchWChains.size === 0) {
                const arr = Array.from(touchBChains);
                for (let i = 1; i < arr.length; i++) {
                  chains[arr[0]].friendlyLinks.add(arr[i]);
                  chains[arr[i]].friendlyLinks.add(arr[0]);
                }
              } else if (touchWChains.size > 1 && touchBChains.size === 0) {
                const arr = Array.from(touchWChains);
                for (let i = 1; i < arr.length; i++) {
                  chains[arr[0]].friendlyLinks.add(arr[i]);
                  chains[arr[i]].friendlyLinks.add(arr[0]);
                }
              }
            }
          }
        }

        const dragonId = new Int32Array(chains.length).fill(-1);
        const dragons = [];
        for (let i = 0; i < chains.length; i++) {
          if (dragonId[i] !== -1) continue;
          const dId = dragons.length;
          const q = [i];
          dragonId[i] = dId;
          const memberChains = [];
          const allStones = [];
          const allLibs = new Set();
          while (q.length) {
            const cid = q.shift();
            const ch = chains[cid];
            memberChains.push(ch);
            for (const st of ch.stones) allStones.push(st);
            for (const lib of ch.liberties) allLibs.add(lib);
            for (const nb of ch.friendlyLinks) {
              if (dragonId[nb] === -1) {
                dragonId[nb] = dId;
                q.push(nb);
              }
            }
          }
          dragons.push({
            id: dId,
            color: chains[i].color,
            chains: memberChains,
            stones: allStones,
            liberties: allLibs,
            enclosedSpace: 0,
            moyoSpace: 0,
            eyeScore: 0,
            trueEyeRegions: 0,
            touchesOpenArea: false,
            touchesFriendlyMoyo: false,
            isAlive: false,
            env: null,
          });
        }

        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            if (workBoard[r][c] !== 0) continue;
            const owner = sealedOwner[r][c];
            if (owner !== 1 && owner !== 2) continue;
            for (const [dr, dc] of DIRS_4) {
              const nr = r + dr,
                nc = c + dc;
              if (!inBounds(nr, nc)) continue;
              const cid = chainIdGrid[nr][nc];
              if (cid !== -1 && chains[cid].color === owner) {
                dragons[dragonId[cid]].enclosedSpace += 0.5;
              }
            }
          }
        }

        const visitedEmpty = Array.from({ length: N }, () => Array(N).fill(false));
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            if (workBoard[r][c] !== 0 || visitedEmpty[r][c]) continue;
            const startOwner = sealedOwner[r][c];
            const q = [[r, c]];
            visitedEmpty[r][c] = true;
            const coords = [];
            let borderB = 0,
              borderW = 0;
            let internalDeadB = 0,
              internalDeadW = 0;
            const touchingDragons = new Set();

            while (q.length) {
              const [cr, cc] = q.shift();
              coords.push([cr, cc]);
              if (deadStones.has(`${cr},${cc}`)) {
                if (rawBoard[cr][cc] === 1) internalDeadB++;
                if (rawBoard[cr][cc] === 2) internalDeadW++;
              }
              for (const [dr, dc] of DIRS_4) {
                const nr = cr + dr,
                  nc = cc + dc;
                if (!inBounds(nr, nc)) continue;
                const v = workBoard[nr][nc];
                if (v === 1 || v === 2) {
                  if (v === 1) borderB++;
                  else borderW++;
                  const cid = chainIdGrid[nr][nc];
                  if (cid !== -1) touchingDragons.add(dragonId[cid]);
                } else if (!visitedEmpty[nr][nc]) {
                  if (startOwner !== 0 && sealedOwner[nr][nc] !== startOwner) {
                    continue;
                  }
                  visitedEmpty[nr][nc] = true;
                  q.push([nr, nc]);
                }
              }
            }

            let bWallStones = 0,
              wWallStones = 0;
            let maxEnemyStoneB = 0,
              maxEnemyStoneW = 0;
            for (const dId of touchingDragons) {
              const d = dragons[dId];
              if (d.color === 1) {
                maxEnemyStoneB = Math.max(maxEnemyStoneB, d.stones.length);
                if (d.stones.length >= 3 || d.liberties.size >= 4)
                  bWallStones += d.stones.length;
              } else {
                maxEnemyStoneW = Math.max(maxEnemyStoneW, d.stones.length);
                if (d.stones.length >= 3 || d.liberties.size >= 4)
                  wWallStones += d.stones.length;
              }
            }

            if (coords.length >= 16 && borderB > 0 && borderW > 0) {
              if (bWallStones >= Math.max(8, wWallStones * 2.6)) {
                for (const dId of touchingDragons) {
                  if (dragons[dId].color === 1) {
                    dragons[dId].touchesFriendlyMoyo = true;
                    if (dragons[dId].stones.length >= 4)
                      dragons[dId].moyoSpace += coords.length;
                  }
                }
                continue;
              } else if (wWallStones >= Math.max(8, bWallStones * 2.6)) {
                for (const dId of touchingDragons) {
                  if (dragons[dId].color === 2) {
                    dragons[dId].touchesFriendlyMoyo = true;
                    if (dragons[dId].stones.length >= 4)
                      dragons[dId].moyoSpace += coords.length;
                  }
                }
                continue;
              } else if (coords.length >= 24 && borderB >= 4 && borderW >= 4) {
                for (const dId of touchingDragons) {
                  dragons[dId].touchesOpenArea = true;
                }
                continue;
              }
            }

            const maxEyeArea = 28;
            if (
              coords.length > maxEyeArea &&
              borderB > 0 &&
              (borderW === 0 || startOwner === 1)
            ) {
              for (const dId of touchingDragons) {
                if (dragons[dId].color === 1) {
                  dragons[dId].eyeScore += 2.5;
                  dragons[dId].trueEyeRegions += 2;
                  dragons[dId].enclosedSpace += coords.length;
                }
              }
            } else if (
              coords.length > maxEyeArea &&
              borderW > 0 &&
              (borderB === 0 || startOwner === 2)
            ) {
              for (const dId of touchingDragons) {
                if (dragons[dId].color === 2) {
                  dragons[dId].eyeScore += 2.5;
                  dragons[dId].trueEyeRegions += 2;
                  dragons[dId].enclosedSpace += coords.length;
                }
              }
            } else if (
              coords.length <= maxEyeArea &&
              borderB > 0 &&
              (borderW === 0 ||
                startOwner === 1 ||
                (coords.length <= 14 &&
                  borderB >= borderW * 4.5 &&
                  maxEnemyStoneW <= 2))
            ) {
              const eyes = evaluateEyeSpaceComprehensive(
                coords,
                workBoard,
                1,
                deadStones,
                internalDeadW,
              );
              for (const dId of touchingDragons) {
                if (dragons[dId].color === 1) {
                  dragons[dId].eyeScore += eyes;
                  if (eyes >= 0.9) dragons[dId].trueEyeRegions++;
                  dragons[dId].enclosedSpace += coords.length;
                }
              }
            } else if (
              coords.length <= maxEyeArea &&
              borderW > 0 &&
              (borderB === 0 ||
                startOwner === 2 ||
                (coords.length <= 14 &&
                  borderW >= borderB * 4.5 &&
                  maxEnemyStoneB <= 2))
            ) {
              const eyes = evaluateEyeSpaceComprehensive(
                coords,
                workBoard,
                2,
                deadStones,
                internalDeadB,
              );
              for (const dId of touchingDragons) {
                if (dragons[dId].color === 2) {
                  dragons[dId].eyeScore += eyes;
                  if (eyes >= 0.9) dragons[dId].trueEyeRegions++;
                  dragons[dId].enclosedSpace += coords.length;
                }
              }
            }
          }
        }

        for (const d of dragons) {
          d.env = analyzeDragonEnvironment(
            workBoard,
            chains,
            chainIdGrid,
            dragonId,
            dragons,
            d,
          );
          for (const ch of d.chains) ch.eyeScore = d.eyeScore;

          const aliveByEyes =
            d.eyeScore >= 1.85 ||
            (d.trueEyeRegions >= 2 && d.eyeScore >= 1.7) ||
            d.enclosedSpace >= 7.5;

          const aliveByMoyo =
            d.moyoSpace >= 14 &&
            (d.stones.length >= 5 ||
              d.eyeScore >= 0.9 ||
              d.env.friendlyWallWeight >= d.env.enemyWallWeight * 0.7);

          const aliveByDominantWall =
            d.stones.length >= 10 &&
            d.liberties.size >= 6 &&
            d.env.emptyReached >= 18 &&
            d.env.enemyWallWeight < d.stones.length * 1.15 &&
            d.env.friendlyWallWeight + d.stones.length >
              d.env.enemyWallWeight * 1.15;

          const aliveInFriendlyOpen =
            ((d.touchesFriendlyMoyo || d.touchesOpenArea) &&
              d.liberties.size >= 4 &&
              d.env.friendlyWallWeight + d.stones.length * 0.8 >=
                d.env.enemyWallWeight * 0.85) ||
            (d.touchesOpenArea &&
              d.stones.length >= 4 &&
              d.liberties.size >= 7 &&
              d.env.emptyReached >= 22);

          if (
            aliveByEyes ||
            aliveByMoyo ||
            aliveByDominantWall ||
            aliveInFriendlyOpen
          ) {
            d.isAlive = true;
            for (const ch of d.chains) ch.isAlive = true;
          }
        }

        detectSekiChains(chains, workBoard);
        for (const d of dragons) {
          if (d.chains.some((ch) => ch.isAlive || ch.isSeki)) d.isAlive = true;
        }

        for (const d of dragons) {
          d.env = analyzeDragonEnvironment(
            workBoard,
            chains,
            chainIdGrid,
            dragonId,
            dragons,
            d,
          );
          if (!d.isAlive) {
            if (
              d.env.aliveFriendWeight >= 5.0 &&
              d.env.aliveFriendWeight >= d.env.enemyWallWeight * 0.5 &&
              d.liberties.size >= 2
            ) {
              d.isAlive = true;
              for (const ch of d.chains) ch.isAlive = true;
            }
          }
        }

        const survivalStrength = (d) =>
          d.eyeScore * 5.0 +
          d.enclosedSpace * 1.2 +
          d.env.aliveFriendWeight * 1.5 +
          d.env.friendlyWallWeight * 0.6 +
          d.liberties.size * 1.2 -
          d.env.aliveEnemyWallWeight * 0.8;

        let anyKilled = false;
        const candidates = dragons
          .filter((d) => !d.isAlive)
          .sort((a, b) => survivalStrength(a) - survivalStrength(b));

        for (const d of candidates) {
          const stoneCnt = d.stones.length;
          const libCnt = d.liberties.size;
          const env = d.env;

          if (d.touchesOpenArea && libCnt >= 7 && env.emptyReached >= 22) continue;

          let hasWeakerUnaliveEnemy = false;
          for (const eneId of env.touchedEnemyDragons) {
            const eneD = dragons[eneId];
            if (
              eneD &&
              !eneD.isAlive &&
              eneD.stones.length >= 6 &&
              survivalStrength(d) > survivalStrength(eneD) + 3.0
            ) {
              hasWeakerUnaliveEnemy = true;
              break;
            }
          }
          if (hasWeakerUnaliveEnemy) continue;

          let isDead = false;
          if (libCnt <= 1 && env.enemyWallWeight >= stoneCnt * 0.7) {
            isDead = true;
          } else if (
            libCnt === 2 &&
            d.eyeScore < 1.2 &&
            env.aliveFriendWeight < 2.0 &&
            env.enemyWallWeight >= stoneCnt + 2
          ) {
            isDead = true;
          } else if (
            stoneCnt <= 9 &&
            d.eyeScore < 1.5 &&
            env.aliveFriendWeight < 2.5 &&
            env.enemyWallWeight >= Math.max(4.5, stoneCnt * 1.1) &&
            env.enemyWallWeight >= env.friendlyWallWeight * 2.2
          ) {
            isDead = true;
          } else if (
            d.eyeScore < 1.75 &&
            d.enclosedSpace <= 5 &&
            env.aliveFriendWeight < 2.0 &&
            env.enemyWallWeight >= env.friendlyWallWeight * 2.2 &&
            (env.aliveEnemyWallWeight >= Math.min(16, stoneCnt * 0.4 + 3.5) ||
              (env.emptyReached <= 14 &&
                env.enemyWallWeight >= Math.max(10, stoneCnt * 0.65)))
          ) {
            isDead = true;
          }

          if (isDead) {
            for (const [sr, sc] of d.stones) {
              const k = `${sr},${sc}`;
              if (!deadStones.has(k)) {
                deadStones.add(k);
                anyKilled = true;
              }
            }
            if (stoneCnt >= 10) break;
          }
        }

        const swept = sweepTrappedRemnants(rawBoard, deadStones, 12);
        if (!anyKilled && !swept && pass >= 1) break;
      }

      return computeTerritoryAndSituation(rawBoard, deadStones);
    }

    function buildVirtualSealedRegions(finalGrid) {
      const territoryOwner = Array.from({ length: N }, () => Array(N).fill(0));
      const isDirectDame = Array.from({ length: N }, () => Array(N).fill(false));

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (finalGrid[r][c] !== 0) continue;
          let adjB = 0,
            adjW = 0;
          for (const [dr, dc] of DIRS_4) {
            const nr = r + dr,
              nc = c + dc;
            if (!inBounds(nr, nc)) continue;
            if (finalGrid[nr][nc] === 1) adjB++;
            else if (finalGrid[nr][nc] === 2) adjW++;
          }
          if (adjB > 0 && adjW > 0) {
            isDirectDame[r][c] = true;
          }
        }
      }

      const virtualWall = Array.from({ length: N }, () => Array(N).fill(0));
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (finalGrid[r][c] !== 0 || isDirectDame[r][c]) continue;

          if (
            r > 0 &&
            r < N - 1 &&
            finalGrid[r - 1][c] !== 0 &&
            finalGrid[r - 1][c] === finalGrid[r + 1][c]
          ) {
            const col = finalGrid[r - 1][c];
            const ene = 3 - col;
            if (
              (c === 0 || finalGrid[r][c - 1] !== ene) &&
              (c === N - 1 || finalGrid[r][c + 1] !== ene)
            ) {
              virtualWall[r][c] = col;
            }
          }

          if (
            c > 0 &&
            c < N - 1 &&
            finalGrid[r][c - 1] !== 0 &&
            finalGrid[r][c - 1] === finalGrid[r][c + 1]
          ) {
            const col = finalGrid[r][c - 1];
            const ene = 3 - col;
            if (
              (r === 0 || finalGrid[r - 1][c] !== ene) &&
              (r === N - 1 || finalGrid[r + 1][c] !== ene)
            ) {
              virtualWall[r][c] = col;
            }
          }

          if (r === 0 && finalGrid[1][c] !== 0) virtualWall[0][c] = finalGrid[1][c];
          if (r === N - 1 && finalGrid[N - 2][c] !== 0)
            virtualWall[N - 1][c] = finalGrid[N - 2][c];
          if (c === 0 && finalGrid[r][1] !== 0) virtualWall[r][0] = finalGrid[r][1];
          if (c === N - 1 && finalGrid[r][N - 2] !== 0)
            virtualWall[r][N - 1] = finalGrid[r][N - 2];
        }
      }

      const visited = Array.from({ length: N }, () => Array(N).fill(false));
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (finalGrid[r][c] !== 0 || virtualWall[r][c] !== 0 || visited[r][c])
            continue;
          const q = [[r, c]];
          visited[r][c] = true;
          const region = [];
          let touchB = 0,
            touchW = 0;

          while (q.length) {
            const [cr, cc] = q.shift();
            region.push([cr, cc]);
            for (const [dr, dc] of DIRS_4) {
              const nr = cr + dr,
                nc = cc + dc;
              if (!inBounds(nr, nc)) continue;
              const v = finalGrid[nr][nc] || virtualWall[nr][nc];
              if (v === 1) touchB++;
              else if (v === 2) touchW++;
              else if (!visited[nr][nc]) {
                visited[nr][nc] = true;
                q.push([nr, nc]);
              }
            }
          }

          if (touchB > 0 && touchW === 0) {
            for (const [rr, rc] of region) territoryOwner[rr][rc] = 1;
          } else if (touchW > 0 && touchB === 0) {
            for (const [rr, rc] of region) territoryOwner[rr][rc] = 2;
          }
        }
      }

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (finalGrid[r][c] !== 0 || virtualWall[r][c] === 0) continue;
          const col = virtualWall[r][c];
          let touchesSameEmpty = false;
          for (const [dr, dc] of DIRS_4) {
            const nr = r + dr,
              nc = c + dc;
            if (inBounds(nr, nc) && territoryOwner[nr][nc] === col) {
              touchesSameEmpty = true;
              break;
            }
          }
          if (touchesSameEmpty && !isDirectDame[r][c]) {
            territoryOwner[r][c] = col;
          }
        }
      }

      return { territoryOwner, isDirectDame };
    }

    function computeTerritoryAndSituation(rawBoard, deadStones) {
      N = rawBoard.length;
      const finalGrid = Array.from({ length: N }, (_, r) =>
        Array.from({ length: N }, (_, c) =>
          deadStones.has(`${r},${c}`) ? 0 : rawBoard[r][c],
        ),
      );

      const inf = computeDualInfluenceField(finalGrid);
      const { territoryOwner, isDirectDame } = buildVirtualSealedRegions(finalGrid);

      let blackStones = 0,
        whiteStones = 0;
      let blackTerritory = 0,
        whiteTerritory = 0;
      let blackPotential = 0,
        whitePotential = 0;
      let sharedDameOrSekiLib = 0;
      let openBoundaryCount = 0;

      const territoryMap = Array.from({ length: N }, () => Array(N).fill(0));
      const visited = Array.from({ length: N }, () => Array(N).fill(false));

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (finalGrid[r][c] === 1) blackStones++;
          else if (finalGrid[r][c] === 2) whiteStones++;
        }
      }

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (finalGrid[r][c] !== 0 || visited[r][c]) continue;
          const q = [[r, c]];
          const region = [];
          visited[r][c] = true;
          let touchB = 0,
            touchW = 0;

          while (q.length) {
            const [cr, cc] = q.shift();
            region.push([cr, cc]);
            for (const [dr, dc] of DIRS_4) {
              const nr = cr + dr,
                nc = cc + dc;
              if (!inBounds(nr, nc)) continue;
              if (finalGrid[nr][nc] === 1) touchB++;
              else if (finalGrid[nr][nc] === 2) touchW++;
              else if (!visited[nr][nc]) {
                visited[nr][nc] = true;
                q.push([nr, nc]);
              }
            }
          }

          if (touchB > 0 && touchW === 0) {
            blackTerritory += region.length;
            for (const [rr, rc] of region) territoryMap[rr][rc] = 1;
            continue;
          }
          if (touchW > 0 && touchB === 0) {
            whiteTerritory += region.length;
            for (const [rr, rc] of region) territoryMap[rr][rc] = 2;
            continue;
          }

          if (region.length <= 5 && touchB > 0 && touchW > 0) {
            for (const [rr, rc] of region) {
              if (territoryOwner[rr][rc] === 1 && !isDirectDame[rr][rc]) {
                blackTerritory++;
                territoryMap[rr][rc] = 1;
              } else if (territoryOwner[rr][rc] === 2 && !isDirectDame[rr][rc]) {
                whiteTerritory++;
                territoryMap[rr][rc] = 2;
              } else {
                sharedDameOrSekiLib++;
                territoryMap[rr][rc] = 3;
              }
            }
            continue;
          }

          for (const [rr, rc] of region) {
            if (isDirectDame[rr][rc]) {
              sharedDameOrSekiLib++;
              territoryMap[rr][rc] = 3;
              continue;
            }
            if (territoryOwner[rr][rc] === 1) {
              blackTerritory++;
              territoryMap[rr][rc] = 1;
              continue;
            }
            if (territoryOwner[rr][rc] === 2) {
              whiteTerritory++;
              territoryMap[rr][rc] = 2;
              continue;
            }

            const val = inf[rr][rc];
            let nearEnemyB = false,
              nearEnemyW = false;
            for (const [dr, dc] of DIRS_8) {
              const nr = rr + dr,
                nc = rc + dc;
              if (!inBounds(nr, nc)) continue;
              if (finalGrid[nr][nc] === 1) nearEnemyB = true;
              if (finalGrid[nr][nc] === 2) nearEnemyW = true;
            }

            if (nearEnemyB && nearEnemyW) {
              sharedDameOrSekiLib++;
              territoryMap[rr][rc] = 3;
            } else if (val >= 22.0 && !nearEnemyW) {
              blackTerritory++;
              territoryMap[rr][rc] = 1;
            } else if (val <= -22.0 && !nearEnemyB) {
              whiteTerritory++;
              territoryMap[rr][rc] = 2;
            } else if (val >= 9.0 && !nearEnemyW) {
              openBoundaryCount++;
              blackPotential++;
              territoryMap[rr][rc] = 4;
            } else if (val <= -9.0 && !nearEnemyB) {
              openBoundaryCount++;
              whitePotential++;
              territoryMap[rr][rc] = 5;
            } else {
              sharedDameOrSekiLib++;
              territoryMap[rr][rc] = 3;
            }
          }
        }
      }

      const totalBEmpty = blackTerritory + blackPotential;
      const totalWEmpty = whiteTerritory + whitePotential;
      const blackBase = blackStones + totalBEmpty;
      const whiteBase = whiteStones + totalWEmpty;
      const blackTotal = blackBase + sharedDameOrSekiLib * 0.5;
      const whiteTotal = whiteBase + sharedDameOrSekiLib * 0.5;

      return {
        blackStones,
        blackTerritory: totalBEmpty,
        blackSolidTerritory: blackTerritory,
        blackPotential,
        blackBase,
        whiteStones,
        whiteTerritory: totalWEmpty,
        whiteSolidTerritory: whiteTerritory,
        whitePotential,
        whiteBase,
        sharedDameOrSekiLib,
        openBoundaryCount,
        isUnfinishedYose: openBoundaryCount >= 10,
        blackTotal,
        whiteTotal,
        deadStones,
        territoryMap,
        finalGrid,
      };
    }

    /* =========================================================================
     * 5. 棋盤互動（點擊棋塊手動切換死活並即時重算）
     * ========================================================================= */
    const canvasEl = document.getElementById("countCanvas");
    if (canvasEl) {
      function getConnectedChain(board, r, c) {
        const bSize = board.length;
        const color = board[r][c];
        if (!color) return [];
        const enemy = 3 - color;
        const seen = new Set([`${r},${c}`]);
        const q = [[r, c]];
        const stones = [];
        while (q.length) {
          const [cr, cc] = q.shift();
          stones.push([cr, cc]);
          for (const [dr, dc] of DIRS_4) {
            const nr = cr + dr,
              nc = cc + dc;
            if (nr < 0 || nr >= bSize || nc < 0 || nc >= bSize) continue;
            const k = `${nr},${nc}`;
            if (!seen.has(k) && board[nr][nc] === color) {
              seen.add(k);
              q.push([nr, nc]);
            }
          }
          for (const [dr, dc] of DIRS_DIAG) {
            const nr = cr + dr,
              nc = cc + dc;
            if (nr < 0 || nr >= bSize || nc < 0 || nc >= bSize) continue;
            const k = `${nr},${nc}`;
            if (
              !seen.has(k) &&
              board[nr][nc] === color &&
              !(board[cr + dr][cc] === enemy && board[cr][cc + dc] === enemy)
            ) {
              seen.add(k);
              q.push([nr, nc]);
            }
          }
        }
        return stones;
      }

      canvasEl.addEventListener("pointerdown", (e) => {
        if (countUI.showOriginal) return;
        if (!countUI.board || !countUI.result) return;
        const rect = canvasEl.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const bSize = countUI.board.length;
        const size = rect.width;
        const pad = size * 0.048;
        const cell = (size - pad * 2) / (bSize - 1);
        const cx = Math.round((x - pad) / cell);
        const ry = Math.round((y - pad) / cell);
        if (cx < 0 || cx >= bSize || ry < 0 || ry >= bSize) return;
        if (countUI.board[ry][cx] === 0) return;

        const chain = getConnectedChain(countUI.board, ry, cx);
        if (!chain.length) return;
        const anyDead = chain.some(([r, c]) => countUI.manualDead.has(`${r},${c}`));
        for (const [r, c] of chain) {
          const k = `${r},${c}`;
          if (anyDead) countUI.manualDead.delete(k);
          else countUI.manualDead.add(k);
        }
        countUI.result = computeTerritoryAndSituation(
          countUI.board,
          countUI.manualDead,
        );
        updateScoreText();
        drawCountCanvas();
      });
    }

    window.addEventListener("resize", () => {
      if (resultView.classList.contains("active") && countUI.img) {
        drawCountCanvas();
      }
    });
  </script>
